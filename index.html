// ───────────────────────── Doggy High Five: tiny synth ─────────────────────────
const SFX = {
  ctx: null, out: null, muted: false,
  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC(); this.out = this.ctx.createGain(); this.out.gain.value = 0.45; this.out.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  tone(f0, f1, dur, type = 'square', vol = 0.2, delay = 0) {
    if (!this.ctx || this.muted || this.quiet) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + 0.03);
  },
  hiss(dur, freq, q = 1, vol = 0.3, delay = 0, f1 = 0) {
    if (!this.ctx || this.muted || this.quiet) return;
    const c = this.ctx, t = c.currentTime + delay, n = Math.ceil(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t);
  },
  bark(p = 1, vol = 0.22) { this.tone(560 * p, 250 * p, 0.1, 'sawtooth', vol); this.hiss(0.08, 1500 * p, 1, vol); },
  boof(p = 1) { this.tone(300 * p, 170 * p, 0.09, 'sawtooth', 0.14); },
  whine(p = 1) { this.tone(650 * p, 1050 * p, 0.16, 'sine', 0.13); this.tone(1050 * p, 560 * p, 0.24, 'sine', 0.13, 0.16); },
  sneeze() { this.hiss(0.2, 2600, 0.6, 0.35, 0, 900); this.tone(900, 400, 0.1, 'triangle', 0.12); },
  whoosh() { this.hiss(0.16, 500, 0.9, 0.22, 0, 2200); },
  slap(k = 1) { this.hiss(0.14, 2400, 0.6, 0.9 * k); this.tone(210, 55, 0.16, 'sine', 0.6 * k); },
  boop() { this.tone(900, 420, 0.13, 'sine', 0.35); this.tone(1350, 620, 0.1, 'triangle', 0.12, 0.02); },
  thump() { this.tone(130, 45, 0.14, 'sine', 0.4); },
  flop() { this.tone(420, 70, 0.4, 'triangle', 0.3); this.hiss(0.12, 300, 0.7, 0.4, 0.36); this.tone(90, 40, 0.18, 'sine', 0.5, 0.36); },
  hop() { this.tone(380, 760, 0.09, 'square', 0.06); },
  nope() { this.tone(300, 200, 0.14, 'square', 0.1); this.tone(220, 150, 0.2, 'square', 0.1, 0.14); },
  chitter() { for (let i = 0; i < 6; i++) this.tone(2300 + (i % 2) * 500, 1900, 0.04, 'square', 0.05, i * 0.055); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => { this.tone(f, f, 0.16, 'square', 0.12, i * 0.09); this.tone(f * 2, f * 2, 0.16, 'triangle', 0.08, i * 0.09); }); },
  win() { this.quiet = false; [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, f, i === 7 ? 0.6 : 0.14, 'square', 0.12, i * 0.13)); },
};

// ═══ game-core.js ═══
// ───────────────────────── Doggy High Five: rules of the park ─────────────────────────
const G = {
  mode: 'title', time: 0, world: { time: 0, squirrel: null },
  you: null, pal: null, brain: null, auto: null,
  level: 0, done: 0, phase: 'play', pt: 0,
  keys: { back: false, fwd: false, up: false, down: false }, slapQ: false,
  shake: 0, hitstop: 0, cool: 0, sqT: 18, whiffT: 0, hit: false, popCool: 0,
  stats: null, best: null, newBest: false, paused: false, modeT: 0,
};
const pick = (a) => a[Math.floor(rnd(a.length))];
const FLOP_YOU = ['you leaned back like it was a chair', 'gravity: 1, dog: 0', 'belly rubs? no? ok', 'the tail was not a counterweight', 'nailed it (the ground)'];
const FLOP_PAL = ['they have also discovered gravity', 'no notes', 'they meant to do that', 'solidarity'];
const AUTO_AI = { ...BREEDS.biscuit.ai, quirk: 0.08, quirks: ['spin', 'bork'], squirrel: 0 };

function newStats() { return { time: 0, slaps: 0, boops: 0, bonks: 0, flops: 0, shakes: 0, whiffs: 0, squirrels: 0, stars: 0 }; }

function spawnPal(key, walkIn) {
  const b = BREEDS[key], y = G.you;
  const pal = new Dog(key, -1, partnerX(b));
  // nose-to-nose (not nose-through-nose) when both are on all fours
  const reach = (q) => q.bodyL + q.neck * 0.76 + q.headR * 0.75 + q.snout;
  pal.shift = Math.max(20, PX - y.shift + reach(y.b) + 26 + reach(b) - pal.x);
  G.pal = pal; G.brain = new Brain(pal, y);
  if (G.auto) G.auto.o = pal;
  if (walkIn) { pal.xo = W + 50 - (pal.x + pal.shift) + reach(b); pal.walk = 1; G.brain.set('wait'); G.phase = 'enter'; }
  else G.phase = 'play';
  G.pt = 0; G.cool = 0.5; pal.pose();
}

function startTitle() {
  G.mode = 'title'; G.modeT = 0; G.paused = false; FX.clear(); G.world.squirrel = null;
  G.you = new Dog('you', 1, PX); G.auto = null;
  spawnPal(pick(ORDER), false);
  G.auto = new Brain(G.you, G.pal, AUTO_AI);
}

function startGame(level = 0) {
  G.mode = 'play'; G.modeT = 0; G.paused = false; FX.clear(); G.world.squirrel = null;
  G.stats = newStats(); G.level = level; G.done = level; G.newBest = false; G.sqT = rnd(15, 21);
  G.you = new Dog('you', 1, PX); G.auto = null;
  spawnPal(ORDER[level], true);
}

function winGame() {
  G.mode = 'win'; G.modeT = 0; G.world.squirrel = null;
  const t = G.stats.time;
  try {
    const old = parseFloat(localStorage.getItem('dhf-best'));
    if (!(old > 0) || t < old) { localStorage.setItem('dhf-best', String(t)); G.newBest = true; G.best = t; } else G.best = old;
  } catch (e) { G.best = G.best && G.best < t ? G.best : t; }
  FX.confetti(90); SFX.win();
  G.auto = new Brain(G.you, G.pal, AUTO_AI);
  spawnPal(pick(ORDER), true);
}

function dogEvents(d, mine) {
  const p = 25 / d.b.headR, counting = G.mode === 'play' && G.phase === 'play';
  for (const e of d.ev) {
    if (e === 'bark' || e === 'boof' || e === 'whine' || e === 'sneeze') d.yapAt = G.time;   // mouth flies open
    if (e === 'thump') { FX.dust(d.sh.x, GROUND, 4); SFX.thump(); }
    else if (e === 'land') FX.dust(d.hip.x, GROUND, 2);
    else if (e === 'hop') SFX.hop();
    else if (e === 'getup') FX.dust(d.hip.x, GROUND, 4);
    else if (e === 'flop') {
      FX.dust(d.hip.x - d.dir * 40, GROUND, 8); SFX.flop(); G.shake = Math.max(G.shake, 7);
      FX.pop('FLOP!', d.hip.x - d.dir * 30, GROUND - 150, { size: 34, col: '#ff9ecb', sub: pick(mine ? FLOP_YOU : FLOP_PAL) });
      if (mine && counting) G.stats.flops++;
    } else if (e === 'tired') {
      if (mine && !G.auto) FX.pop('LEGS GAVE OUT', d.hip.x, GROUND - 200, { size: 22, col: '#8fd9ff', sub: 'dogs are not built for this' });
      else d.say('phew', 1);
    } else if (e === 'swing') {
      SFX.whoosh();
      if (mine) { if (counting) G.stats.slaps++; G.whiffT = 0.24; G.hit = false; }
    } else if (e === 'bark') SFX.bark(p);
    else if (e === 'boof') SFX.boof(p);
    else if (e === 'whine') SFX.whine(p);
    else if (e === 'sneeze') SFX.sneeze();
  }
  d.ev.length = 0;
}

function highFive(c) {
  const you = G.you, pal = G.pal;
  const stars = c.speed > 520 ? 3 : c.speed > 260 ? 2 : 1;
  G.cool = 3; G.phase = 'celebrate'; G.pt = 0; G.hit = true;
  G.hitstop = 0.16; G.shake = 6 + stars * 5;
  FX.flash(c.x, c.y); FX.ring(c.x, c.y, '#fff', 110 + stars * 30); FX.ring(c.x, c.y, '#ffe066', 70);
  FX.burst(c.x, c.y, 12 + stars * 10); FX.hearts(c.x, c.y - 20, 3 + stars);
  FX.pop('HIGH FIVE!', W / 2, 124, {
    size: 44, col: '#ffd23f', life: 2.1, rot: -0.05,
    sub: ['a gentle, tender pat. it counts.', 'solid. textbook. two good dogs.', 'THUNDERCLAP. the whole park felt that.'][stars - 1],
  });
  SFX.slap(0.5 + stars * 0.25); SFX.fanfare(); SFX.bark(25 / pal.b.headR, 0.15);
  you.om += 0.9 + stars * 0.5; pal.om += 0.9 + stars * 0.5;   // equal and opposite dogs
  you.excite = pal.excite = 1;
  G.brain.set('celebrate'); if (G.auto) G.auto.set('celebrate');
  if (G.mode === 'play') { G.done++; G.stats.stars += stars; G.lastStars = stars; }
}

function handleContacts() {
  const you = G.you, pal = G.pal, st = G.stats, playing = G.mode === 'play';
  if (G.cool > 0) return;
  for (const c of contacts(you, pal)) {
    G.hit = true;
    if (c.type === 'paw') {
      if (c.high) return highFive(c);
      G.cool = 1.6; if (playing) st.shakes++;
      FX.pop('HANDSHAKE', c.x, c.y - 44, { size: 26, col: '#cfe8ff', sub: 'very professional. does not count.' });
      SFX.nope(); pal.say('?', 0.9);
    } else if (c.by === you) {
      G.cool = 0.9; if (playing) st.boops++;
      G.brain.boop(); if (pal.th > 0.5) pal.om += 1.3;
      FX.ring(c.x, c.y, '#ff9ecb', 60); FX.pop('BOOP!', c.x, c.y - 46, { size: 34, col: '#ff9ecb', sub: 'that was their face' });
      SFX.boop(); G.shake = Math.max(G.shake, 5);
    } else {
      G.cool = 0.9; if (playing) st.bonks++;
      you.stun = 0.7; if (you.th > 0.5) you.om += 1.5;
      if (G.auto) G.auto.boop();
      FX.ring(c.x, c.y, '#ffe066', 60); FX.pop('BONK!', c.x, c.y - 46, { size: 34, col: '#ffe066', sub: 'right on your snoot' });
      SFX.boop(); G.shake = Math.max(G.shake, 8);
    }
    return;
  }
}

function simStep(dt) {
  const you = G.you, pal = G.pal, w = G.world, playing = G.mode === 'play';
  w.time += dt; G.cool -= dt; G.pt += dt; G.popCool -= dt;
  SFX.quiet = !playing;

  // ── your brain (it is a dog brain; the keys are more of a suggestion) ──
  if (G.auto) G.auto.update(dt, w);
  else {
    const k = G.keys, inp = you.inp, live = G.phase !== 'celebrate', sq = w.squirrel;
    inp.lean = live ? (k.back ? 1 : 0) - (k.fwd ? 1 : 0) : -0.5;
    inp.paw = live ? (k.up ? 1 : 0) - (k.down ? 1 : 0) : -1;
    inp.slap = live && G.slapQ;
    const hype = G.brain.s === 'wiggle' || G.brain.s === 'up' || G.brain.s === 'offer';
    you.excite = lerp(you.excite, live ? (hype ? 0.85 : 0.3) : 1, dt * 2.5);
    you.focus = sq ? 0.4 : 1;
    const tgt = sq || (pal.offering ? pal.paw : pal.head);
    you.faceT = clamp(Math.atan2(you.head.y - tgt.y, tgt.x - you.head.x), -0.7, 1.2);
    you.mood = you.state !== 'ok' ? 'derp' : you.stun > 0 ? 'squint' : !live ? 'joy' : sq ? 'alert' : you.tired > 0 ? 'sad' : you.th > 0.6 ? 'eager' : 'happy';
    you.bowT = !live && you.th < 0.1 && Math.sin(G.pt * 9) > 0 ? 1 : 0;
  }
  G.slapQ = false;
  G.brain.update(dt, w);

  if (G.phase === 'enter') {
    pal.xo = Math.max(0, pal.xo - dt * 340);
    if (pal.xo <= 0) { pal.walk = 0; G.phase = 'play'; G.pt = 0; G.brain.idle(0.2); pal.ev.push('bark'); pal.say(pick(['hi!!', 'HI', 'oh! hello', 'friend??']), 1.1); }
  } else if (G.phase === 'exit') {
    pal.spin = -1; pal.walk = 1; pal.xo += dt * 400;
    if (pal.x + pal.xo + pal.shift - pal.b.bodyL - 90 > W) {
      G.level++;
      if (G.level >= ORDER.length) winGame(); else { spawnPal(ORDER[G.level], true); G.sqT = rnd(9, 15); }
      return;
    }
  }

  you.step(dt); pal.step(dt);
  dogEvents(you, true); dogEvents(pal, false);
  for (const d of [you, pal]) {
    if (d.state === 'ok' && d.th > 0.55 && d.stam < 0.3 && rnd() < dt * 9) FX.sweat(d.head.x, d.head.y - d.b.headR, rnd() < 0.5 ? -1 : 1);
  }

  if (G.phase === 'celebrate') {
    if (G.pt > 2.7 && you.state === 'ok' && pal.state === 'ok') {
      if (playing) { G.phase = 'exit'; G.brain.set('wait'); if (G.auto) G.auto.idle(); pal.say(pick(['bye!!', 'ok bye', 'BEST DAY', 'tell everyone']), 1.2); }
      else { G.phase = 'play'; G.brain.idle(); if (G.auto) G.auto.idle(); }
    }
  } else if (G.phase === 'play') {
    if (playing) G.stats.time += dt;
    handleContacts();
    if (G.whiffT > 0 && (G.whiffT -= dt) <= 0 && !G.hit && pal.up && G.popCool <= 0 && !G.auto) {
      G.popCool = 1.5; G.stats.whiffs++;
      FX.pop(pick(['WHIFF', 'swish', 'air five']), you.paw.x + 30, you.paw.y - 34, { size: 22, col: '#e8fbff' });
    }
    if (playing && G.level >= 1 && !w.squirrel && (G.sqT -= dt) <= 0) {
      const v = rnd() < 0.5 ? 1 : -1;
      w.squirrel = { x: v > 0 ? -30 : W + 30, y: FENCE_Y - 14, v: v * 240 };
      G.stats.squirrels++; SFX.chitter();
      FX.pop('SQUIRREL!!', W / 2, 215, { size: 34, col: '#ffb35c', life: 1.6, sub: 'your brain has left the chat' });
    }
  }
  if (w.squirrel) {
    w.squirrel.x += w.squirrel.v * dt;
    if (w.squirrel.x < -40 || w.squirrel.x > W + 40) { w.squirrel = null; G.sqT = rnd(15, 26); }
  }
}

// ═══ game-ui.js ═══
// ───────────────────────── Doggy High Five: screen, HUD, input, loop ─────────────────────────
const STAGE = document.getElementById('stage'), CV = document.getElementById('cv'), CTX = CV.getContext('2d');
const STEP = 1 / 120;
let SCALE = 1, BG = null, lastW = 0, SOLO = false, FROZEN = false;
try { SOLO = window.top === window.self; } catch (e) { SOLO = false; }

const TIPS = {
  pickle: 'Pickle is very short. Aim your paw LOW and meet him down there.',
  duchess: 'Duchess will not stoop. Paw HIGH, hold your balance, and wait for her to condescend.',
  nacho: 'Nacho can only reach you mid-hop. Hold your paw out and time the slap.',
  moose: 'Moose cannot see you. Put your paw where HIS paw is about to go.',
};
const fmt = (t) => Math.floor(t / 60) + ':' + (t % 60 < 10 ? '0' : '') + (t % 60).toFixed(1);

// o = 0 means plain ink lettering with no outline (for text sitting on paper)
function txt(g, s, x, y, size, col = '#fff', align = 'center', o = 0.2) { comic(g, s, x, y, size, col, align, o ? {} : { lw: 0 }); }
function pawIcon(g, x, y, r, col) {
  const dots = [[0, r * 0.35, r * 0.62, r * 0.5], [-r * 0.75, -r * 0.3, r * 0.3, r * 0.36], [0, -r * 0.72, r * 0.3, r * 0.36], [r * 0.75, -r * 0.3, r * 0.3, r * 0.36]];
  g.strokeStyle = OUT; g.lineWidth = 5.5; g.fillStyle = col;
  for (const [dx, dy, rx, ry] of dots) { g.beginPath(); g.ellipse(x + dx, y + dy, rx, ry, 0, 0, 7); g.stroke(); }
  for (const [dx, dy, rx, ry] of dots) { g.beginPath(); g.ellipse(x + dx, y + dy, rx, ry, 0, 0, 7); g.fill(); }
}
// narration box, like a comic caption: cream paper, ink border, hard shadow
function pill(g, s, x, y) {
  s = s.toUpperCase();
  const size = s.length > 66 ? 12 : 14;
  g.font = `bold ${size}px ${FONT}`;
  const w = g.measureText(s).width + 30, h = size * 2;
  g.save(); g.translate(x, y); g.rotate(-0.006);
  g.beginPath(); g.roundRect(-w / 2 + 3, -h / 2 + 3.5, w, h, 5); g.fillStyle = OUT; g.fill();
  g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 5); ink(g, '#fff7df', 2.8);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = OUT; g.fillText(s, 0, 1);
  g.restore();
}

function hint() {
  const you = G.you, pal = G.pal, s = G.brain.s;
  if (G.phase === 'enter') return 'A new friend approaches. They want a high five. So do you.';
  if (G.phase !== 'play') return '';
  if (G.world.squirrel) return 'SQUIRREL. Your paw is at 40% power. Your heart is on that fence.';
  if (you.state !== 'ok') return 'Wiggle with dignity. You will be up in a second.';
  if (you.tired > 0) return 'Legs are resting. Let the LEGS bar refill.';
  if (G.level > 0 && G.pt < 9) return TIPS[pal.key];
  if (G.level > 0) return '';
  if (you.th < 0.6) return s === 'wiggle' ? 'Butt wiggle = they are about to stand up. Get ready!' : 'Hold  A  to rear up on your hind legs. Let go before you tip over!';
  if (you.al < 0.8) return 'Tap  A / D  to stay balanced   ·   hold  W  to lift your paw';
  if (!pal.up) return 'Paw is up! Now wait for them... your legs will not last forever';
  return 'Line the paws up, then  SPACE  to slap!';
}

function drawHud(g) {
  const st = G.stats, you = G.you, b = G.pal.b;
  for (let i = 0; i < 5; i++) pawIcon(g, 36 + i * 30, 30, 10, i < G.done ? '#ffd23f' : '#fff');
  txt(g, G.done + ' / 5', 190, 31, 15, '#fff', 'left');
  drawMeters(g, you, 26, 136);
  txt(g, fmt(st.time), W - 22, 28, 26, '#fff', 'right');
  txt(g, b.name, W / 2, 28, 31);
  txt(g, b.kind, W / 2, 53, 12, '#ffd23f');
  txt(g, '“' + b.quip + '”', W / 2, 73, 13, '#fff');
  const h = hint(); if (h) pill(g, h, W / 2, 104);
  if (G.level === 0 && st.time < 6 && G.phase !== 'celebrate') {
    const y = you.head.y - 86 + Math.sin(G.time * 6) * 4;
    txt(g, 'YOU', you.head.x, y, 19, '#ffd23f');
    g.beginPath(); g.moveTo(you.head.x - 8, y + 14); g.lineTo(you.head.x + 8, y + 14); g.lineTo(you.head.x, y + 25); g.closePath(); ink(g, '#ffd23f', 2.6);
  }
  txt(g, `slaps ${st.slaps}  ·  boops ${st.boops}  ·  flops ${st.flops}`, W / 2, 506, 12, '#fff');
  txt(g, 'M mute  ·  P pause  ·  R restart', W / 2, 526, 10.5, '#fff');
}

function drawTitle(g) {
  const t = G.time;
  g.save(); g.translate(W / 2 - 20, 60); g.rotate(-0.04); txt(g, 'DOGGY', 0, 0, 62); g.restore();
  g.save(); g.translate(W / 2 - 20, 130); g.rotate(0.02); const s = 1 + 0.03 * Math.sin(t * 4); g.scale(s, s);
  txt(g, 'HIGH FIVE', 0, 0, 90, '#ffd23f'); g.restore();
  pawIcon(g, W / 2 + 262, 60 + Math.sin(t * 4) * 3, 22, '#ff9ecb');
  pill(g, 'You are a dog. Your friend is a dog. Nobody here has thumbs, balance, or a plan.', W / 2, 198);
  if (Math.sin(t * 5) > -0.4) txt(g, 'PRESS SPACE OR TAP TO START', W / 2, 484, 19, '#fff');
  txt(g, G.best ? 'best time  ' + fmt(G.best) : 'five dogs. five high fives. be the good boy.', W / 2, 512, 12, '#ffd23f');
}

function drawWin(g) {
  const st = G.stats, x = 215, y = 20, w = 530, h = 290;
  g.save(); g.translate(W / 2, y + h / 2); g.rotate(-0.008); g.translate(-W / 2, -(y + h / 2));
  g.beginPath(); g.roundRect(x + 6, y + 7, w, h, 10); g.fillStyle = OUT; g.fill();
  g.beginPath(); g.roundRect(x, y, w, h, 10); ink(g, '#fff7df', 3.6);
  txt(g, 'FIVE HIGH FIVES!', W / 2, y + 46, 44, '#ffd23f');
  const rank = st.time < 75 ? 'BEST IN SHOW' : st.time < 150 ? 'VERY GOOD DOG' : st.time < 300 ? 'GOOD DOG' : 'STILL A GOOD DOG';
  txt(g, fmt(st.time), W / 2 - 115, y + 102, 40, '#fff');
  txt(g, G.newBest ? 'NEW BEST!' : 'best ' + fmt(G.best || st.time), W / 2 - 115, y + 135, 13, '#d6402b', 'center', 0);
  txt(g, rank, W / 2 + 120, y + 102, 25, '#ff9ecb');
  const n = Math.round(st.stars / 3);
  for (let i = 0; i < 5; i++) pawIcon(g, W / 2 + 72 + i * 24, y + 135, 8, i < n ? '#ffd23f' : '#fff');
  const rows = [['slaps thrown', st.slaps], ['air fives (whiffs)', st.whiffs], ['snoots booped', st.boops], ['times bonked', st.bonks],
    ['flops', st.flops], ['handshakes (too formal)', st.shakes], ['squirrels witnessed', st.squirrels], ['regrets', 0]];
  rows.forEach(([k, v], i) => {
    const cx = x + 34 + (i % 2) * 240, cy = y + 172 + Math.floor(i / 2) * 25;
    txt(g, k, cx, cy, 12.5, OUT, 'left', 0); txt(g, String(v), cx + 214, cy, 15, '#d6402b', 'right', 0);
  });
  if (G.modeT > 1.2 && Math.sin(G.time * 5) > -0.4) txt(g, 'SPACE OR TAP TO PLAY AGAIN', W / 2, y + h - 22, 17, '#fff');
  g.restore();
}

function render() {
  const g = CTX;
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  g.save();
  if (G.shake > 0.4) g.translate(rnd(-1, 1) * G.shake, rnd(-1, 1) * G.shake);
  g.drawImage(BG, -12, -12, W + 24, H + 24);
  FX.drawBack(g);
  drawClouds(g, G.time);
  if (G.world.squirrel) drawSquirrel(g, G.world.squirrel, G.time);
  drawDog(g, G.pal, G.time); drawDog(g, G.you, G.time);
  drawArm(g, G.pal); drawArm(g, G.you);
  FX.draw(g);
  g.restore();
  if (G.mode === 'play') drawHud(g); else if (G.mode === 'title') drawTitle(g); else drawWin(g);
  if (G.paused) { g.fillStyle = 'rgba(20,14,10,.55)'; g.fillRect(0, 0, W, H); txt(g, 'PAUSED', W / 2, H / 2 - 10, 60); txt(g, 'P to resume', W / 2, H / 2 + 40, 18, '#ffe066'); }
}

function resize() {
  if (SOLO) STAGE.style.maxWidth = Math.max(320, Math.min(1500, (window.innerHeight - 16) * 16 / 9)) + 'px';
  const w = STAGE.clientWidth || 728;
  if (w === lastW) return; lastW = w;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  CV.width = Math.round(w * dpr); CV.height = Math.round((w * 9 / 16) * dpr); SCALE = CV.width / W;
  STAGE.style.fontSize = Math.max(8.5, w / 64).toFixed(2) + 'px';
  BG = makeBackground(SCALE);
}

// ── input ──
const KEYMAP = { KeyA: 'back', ArrowLeft: 'back', KeyD: 'fwd', ArrowRight: 'fwd', KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down' };
const BTN = {};
document.querySelectorAll('[data-k]').forEach((el) => { BTN[el.dataset.k] = el; });
function setKey(k, v) { G.keys[k] = v; if (BTN[k]) BTN[k].classList.toggle('on', v); }
function action() {
  SFX.init();
  if (G.mode === 'title' || (G.mode === 'win' && G.modeT > 1.2)) startGame();
  else if (G.mode === 'play' && !G.paused) { G.slapQ = true; if (BTN.slap) { BTN.slap.classList.add('on'); setTimeout(() => BTN.slap.classList.remove('on'), 110); } }
}
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = KEYMAP[e.code];
  if (k) { SFX.init(); setKey(k, true); e.preventDefault(); return; }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyF') { e.preventDefault(); if (!e.repeat) action(); }
  else if (e.code === 'KeyM') SFX.muted = !SFX.muted;
  else if ((e.code === 'KeyP' || e.code === 'Escape') && G.mode === 'play') G.paused = !G.paused;
  else if (e.code === 'KeyR' && G.mode === 'play') startGame();
});
addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) setKey(k, false); });
addEventListener('blur', () => { for (const k in G.keys) setKey(k, false); });
for (const k in BTN) {
  const el = BTN[k];
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); SFX.init();
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    if (k === 'slap') action(); else if (G.mode !== 'play') action(); else setKey(k, true);
  });
  const up = () => { if (k !== 'slap') setKey(k, false); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
CV.addEventListener('pointerdown', () => { if (G.mode !== 'play') action(); });

// ── main loop ──
let lastT = 0, acc = 0;
function advance(dt) {
  G.time += dt; G.modeT += dt; G.shake *= Math.pow(0.003, dt);
  if (G.hitstop > 0) G.hitstop -= dt;
  else { acc += dt; while (acc >= STEP) { simStep(STEP); acc -= STEP; } }
  FX.update(dt);
}
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  resize();
  if (!G.paused && !FROZEN) advance(dt);
  render();
  requestAnimationFrame(frame);
}

try { const b = parseFloat(localStorage.getItem('dhf-best')); if (b > 0) G.best = b; } catch (e) { /* no storage, no problem */ }
if (SOLO) document.documentElement.classList.add('solo');
startTitle();
// dev hook for screenshots: ?shot=title|play|win&lvl=0..4&t=seconds
try {
  const q = new URLSearchParams(location.search), m = q.get('shot');
  if (m) {
    if (m === 'play' || m === 'win') { startGame(m === 'win' ? 4 : +q.get('lvl') || 0); G.auto = new Brain(G.you, G.pal, AUTO_AI); }
    resize();
    for (let i = 0, n = (+q.get('t') || 0) * 60; i < n && !(m === 'win' && G.mode === 'win' && G.modeT > 2); i++) {
      advance(1 / 60);
      if (q.has('paint') && i % 2 === 0) render();   // exercise every drawing path on the way
    }
    if (q.has('five')) {   // force the money shot
      highFive({ x: (G.you.paw.x + G.pal.paw.x) / 2, y: (G.you.paw.y + G.pal.paw.y) / 2, speed: 600, high: true });
      for (let i = 0; i < 26; i++) advance(1 / 60);
    }
    if (q.has('sq')) { G.world.squirrel = { x: 330, y: FENCE_Y - 14, v: 240 }; G.pal.mood = 'alert'; G.pal.say('SQUIRREL!!', 9); G.you.mood = 'derp'; }
    FROZEN = true;
  }
} catch (e) { /* ignore */ }
resize();
requestAnimationFrame(frame);

})();
</script>
