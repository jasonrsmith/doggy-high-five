<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doggy High Five</title>
<meta name="description" content="You are a dog. Your friend is a dog. Try to high five them. Nobody here has thumbs, balance, or a plan.">
<style>
  html.solo, html.solo body { margin: 0; background: #f3e9d2; }
  html.solo body { padding: 8px; }
  #stage {
    position: relative; width: 100%; margin: 0 auto; aspect-ratio: 16 / 9; overflow: hidden;
    border-radius: var(--radius, 12px);
    font: bold 12px "Comic Sans MS", "Chalkboard SE", "Comic Neue", "Marker Felt", "Segoe Print", cursive;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  html.solo #stage { border: 4px solid #1d1a18; box-sizing: border-box; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pad { position: absolute; bottom: 2.6%; display: flex; gap: .6em; align-items: flex-end; }
  .pad.l { left: 1.6%; }
  .pad.r { right: 1.8%; }
  /* hand-drawn boxes: lopsided corners, ink border, hard shadow */
  .key {
    font: inherit; color: #1d1a18; background: #fff7df; cursor: pointer; text-transform: uppercase;
    border: .2em solid #1d1a18; border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
    box-shadow: .2em .28em 0 #1d1a18; padding: .3em .6em .32em; min-width: 4.9em;
    text-align: center; line-height: 1.1; touch-action: none;
  }
  .key:nth-child(even) { border-radius: 18px 225px 18px 255px / 255px 18px 225px 18px; }
  .key b { display: block; font-size: 1.5em; }
  .key span { display: block; font-size: .72em; }
  .key.wide { min-width: 7.4em; background: #ffd23f; }
  .key.on, .key:active { transform: translate(.14em, .2em); box-shadow: .06em .08em 0 #1d1a18; background: #ff9ecb; }
  .key:focus-visible { outline: .2em solid #1d1a18; outline-offset: .15em; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="960" height="540" aria-label="Doggy High Five game"></canvas>
  <div class="pad l">
    <button class="key" data-k="back" tabindex="-1"><b>A</b><span>lean back<br>(stand up)</span></button>
    <button class="key" data-k="fwd" tabindex="-1"><b>D</b><span>lean<br>forward</span></button>
  </div>
  <div class="pad r">
    <button class="key" data-k="up" tabindex="-1"><b>W</b><span>paw<br>up</span></button>
    <button class="key" data-k="down" tabindex="-1"><b>S</b><span>paw<br>down</span></button>
    <button class="key wide" data-k="slap" tabindex="-1"><b>SPACE</b><span>SLAP!<br>&nbsp;</span></button>
  </div>
</div>
<script>
'use strict';
(() => {
// ═══ sim.js ═══
// ───────────────────────── Doggy High Five: simulation ─────────────────────────
// Pure logic, no DOM. Every dog (you included) is the same wobbly machine:
// an inverted pendulum on hind legs with one floppy paw.

const W = 960, H = 540, GROUND = 440, PX = 392;
const TH0 = 1.43; // the (unstable) angle where a dog balances upright
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const noise = (t) => (Math.sin(t * 1.7) + 0.6 * Math.sin(t * 2.9 + 1.3) + 0.35 * Math.sin(t * 5.3 + 4.1)) / 1.95;

const BREEDS = {
  you: {
    name: 'YOU', kind: 'Very Good Mutt',
    hipH: 70, bodyL: 95, armL: 100, thick: 54, headR: 29, snout: 27, neck: 30, pawR: 13,
    standTime: 7.5, assist: 1.0, wobble: 1,
    fur: '#cf8848', belly: '#f6e3c5', dark: '#7a4a22', earC: '#8f5a2c', ear: 'flop', tail: 'curl', collar: '#e2413d',
  },
  biscuit: {
    name: 'BISCUIT', kind: 'Golden Retriever', quip: 'Has done this before. Believes in you.',
    hipH: 74, bodyL: 100, armL: 102, thick: 58, headR: 30, snout: 30, neck: 30, pawR: 14,
    standTime: 8.5, assist: 1.2, wobble: 0.8,
    fur: '#ecb858', belly: '#f9e6b4', dark: '#9a6a22', earC: '#c98f3a', ear: 'flop', tail: 'plume', collar: '#3d7be2',
    ai: { idle: [0.7, 1.5], offer: [3.4, 4.6], react: [0.2, 0.36], lag: 0.12, err: 6, wob: 0.3, aim: 'track', quirk: 0.14, quirks: ['bork', 'shake'], squirrel: 0.55, flop: 0.05 },
  },
  pickle: {
    name: 'PICKLE', kind: 'Corgi', quip: 'Legally this is a low five. He is doing his best.',
    hipH: 30, bodyL: 92, armL: 54, thick: 52, headR: 28, snout: 25, neck: 20, pawR: 11,
    standTime: 5.5, assist: 0.95, wobble: 1.2,
    fur: '#e8923a', belly: '#fff5e3', dark: '#9a5a1c', earC: '#e8923a', ear: 'point', tail: 'nub', collar: '#2fae6b',
    ai: { idle: [0.6, 1.3], offer: [2.4, 3.3], react: [0.18, 0.32], lag: 0.18, err: 9, wob: 0.6, aim: 'track', quirk: 0.28, quirks: ['spin', 'shake', 'bork'], squirrel: 0.75, flop: 0.16 },
  },
  duchess: {
    name: 'DUCHESS', kind: 'Great Dane', quip: 'Will not be bending down for you.',
    hipH: 104, bodyL: 132, armL: 130, thick: 60, headR: 33, snout: 40, neck: 44, pawR: 17,
    standTime: 9.5, assist: 1.25, wobble: 0.6,
    fur: '#8b92a3', belly: '#c5cad4', dark: '#4b5160', earC: '#6d7485', ear: 'point', tail: 'whip', collar: '#b98be8',
    ai: { idle: [1.4, 2.4], offer: [4.5, 6], react: [0.45, 0.7], lag: 0.45, err: 5, wob: 0.2, aim: 'fixed', pose: 2.15, quirk: 0.22, quirks: ['snub'], squirrel: 0.15, flop: 0.03 },
  },
  nacho: {
    name: 'NACHO', kind: 'Chihuahua', quip: 'Six pounds of pure voltage.',
    hipH: 24, bodyL: 44, armL: 38, thick: 29, headR: 20, snout: 13, neck: 12, pawR: 8,
    standTime: 6, assist: 1.4, wobble: 1.6, hopV: 545, shiver: 1,
    fur: '#e9c791', belly: '#fbf0d8', dark: '#8a6a3a', earC: '#d9a86a', ear: 'bat', tail: 'whip', collar: '#ff5fa2',
    ai: { idle: [0.3, 0.8], offer: [1.8, 2.6], react: [0.06, 0.14], lag: 0.05, err: 16, wob: 1.0, aim: 'hop', quirk: 0.45, quirks: ['zoom', 'spin', 'bork'], squirrel: 0.9, flop: 0.1 },
  },
  moose: {
    name: 'MOOSE', kind: 'Old English Sheepdog', quip: 'Cannot see you. Believes anyway.',
    hipH: 78, bodyL: 104, armL: 106, thick: 72, headR: 35, snout: 22, neck: 26, pawR: 17,
    standTime: 7.5, assist: 1.05, wobble: 1.1, shag: 1,
    fur: '#f3f3f0', belly: '#ffffff', dark: '#7d8490', earC: '#9aa0ab', ear: 'shag', tail: 'nub', collar: '#f2a03d',
    ai: { idle: [0.8, 1.6], offer: [3.6, 4.6], react: [0.3, 0.5], lag: 0, err: 0, wob: 0.7, aim: 'blind', quirk: 0.18, quirks: ['spin', 'bork'], squirrel: 0.1, flop: 0.14 },
  },
};
const ORDER = ['biscuit', 'pickle', 'duchess', 'nacho', 'moose'];

// Where a partner stands so that two upright dogs can *just* reach each other.
function partnerX(pb, yb = BREEDS.you) {
  return PX + 0.14 * (pb.bodyL + yb.bodyL) + 0.72 * (pb.armL + yb.armL);
}

class Dog {
  constructor(key, dir, x) {
    this.key = key; this.b = BREEDS[key]; this.dir = dir; this.x = x;
    this.shift = this.b.bodyL + 12;       // hips tuck this far forward when rearing up
    this.th = 0; this.om = 0;             // body pitch (0 = all fours, TH0 = upright) + velocity
    this.al = 0; this.alv = 0;            // paw angle (0 = hanging, PI = straight up) + velocity
    this.ext = 0.62; this.extv = 0;       // arm extension (slap = 1)
    this.slapT = 0; this.slapCd = 0; this.cock = 0;
    this.jy = 0; this.jv = 0;             // hop
    this.stam = 1; this.tired = 0; this.stun = 0; this.focus = 1;
    this.state = 'ok'; this.st = 0;       // ok | flop | getup
    this.bow = 0; this.bowT = 0;          // play bow
    this.xo = 0; this.walk = 0; this.wph = 0; this.spin = 1;
    this.wag = rnd(6); this.excite = 0.3;
    this.earA = 0; this.earV = 0; this.dang = 0; this.dangV = 0;
    this.faceA = 0.1; this.faceT = 0.1; this.headDir = 1;
    this.mood = 'happy'; this.blink = rnd(1, 4); this.emote = null;
    this.seed = rnd(100); this.t = 0; this.planted = true;
    this.inp = { lean: 0, paw: 0, slap: false, hop: false };
    this.ev = [];
    this.hip = { x: 0, y: 0 }; this.sh = { x: 0, y: 0 }; this.head = { x: 0, y: 0 };
    this.nose = { x: 0, y: 0 }; this.face = { x: 0, y: 0 }; this.paw = { x: 0, y: 0 }; this.pawV = { x: 0, y: 0 };
    this.pose();
  }

  say(text, t = 1.2) { this.emote = { text, t, max: t }; }

  step(dt) {
    const b = this.b, inp = this.inp;
    this.t += dt; this.slapCd -= dt; this.slapT -= dt; this.stun -= dt; this.tired -= dt;
    const ox = this.paw.x, oy = this.paw.y, oth = this.om;

    if (this.state === 'ok') {
      const standing = this.th > 0.55;
      this.stam = clamp(this.stam + (standing ? -dt / b.standTime : dt / 1.8), 0, 1);
      if (standing && this.stam <= 0 && this.tired <= 0) { this.tired = 1.3; this.ev.push('tired'); }
      let lean = clamp(inp.lean, -1, 1), paw = clamp(inp.paw, -1, 1), slap = inp.slap;
      if (this.tired > 0) { lean = -0.8; paw = -0.5; slap = false; }
      if (this.stun > 0) { lean = 0; paw = 0; slap = false; }

      // ── balance: gravity wants you on all fours (or on your back) ──
      const upT = lerp(17, 5, clamp(this.th / 1.2, 0, 1));
      let acc = -9 * Math.cos(this.th + (Math.PI / 2 - TH0));
      acc += lean > 0 ? lean * upT : lean * 7;
      const e = this.th - TH0;
      if (Math.abs(e) < 0.5 && this.tired <= 0) {   // ankles help a bit... while the legs last
        const a = b.assist * (0.3 + 0.7 * this.stam) * (1 - 0.5 * Math.abs(e) / 0.5);
        acc += a * (-15 * e - 5 * this.om);
      }
      if (this.th > 0.3) acc += (0.6 + 2.0 * this.excite + 2.4 * (1 - this.stam)) * b.wobble * noise(this.t * 3.1 + this.seed);
      if (this.th > 0.5) acc -= 1.3 * Math.sin(this.al) * this.ext;  // a raised paw drags you forward
      acc -= 1.8 * this.om;
      this.om += acc * dt; this.th += this.om * dt;
      if (this.th < 0) {
        if (this.om < -2.2) this.ev.push('thump');
        this.th = 0; this.om = this.om < -2.5 ? -this.om * 0.18 : 0;
      }
      if (this.th > 2.05) { this.state = 'flop'; this.st = 0; this.slapT = 0; this.ev.push('flop'); }

      // ── paw: you can lift it, but it would rather not stay up ──
      const sag = 3.0 * (1.35 - 0.6 * this.stam);
      let pa = paw * 16 * this.focus - sag * Math.sin(this.al) - 4.4 * this.alv;
      pa += 0.9 * noise(this.t * 4.3 + this.seed * 2) * (1 - this.stam + this.excite * 0.5 + (b.shiver || 0));
      this.alv += pa * dt; this.al += this.alv * dt;
      if (this.al < 0) { this.al = 0; this.alv = 0; }
      if (this.al > 2.9) { this.al = 2.9; this.alv = 0; }

      if (slap && this.slapCd <= 0) {
        this.slapT = 0.17; this.slapCd = 0.6;
        if (this.th > 0.5) this.om += 0.3;   // newton says: slap forward, tip backward
        this.ev.push('swing');
      }
      if (inp.hop && this.jy <= 0 && b.hopV) { this.jv = b.hopV; this.ev.push('hop'); }
    } else if (this.state === 'flop') {
      this.st += dt;
      this.om += (40 * (3.0 - this.th) - 9 * this.om) * dt; this.th += this.om * dt;
      this.al += (2.5 + 0.35 * Math.sin(this.t * 13) - this.al) * Math.min(1, dt * 8); this.alv = 0;
      if (this.st > 1.5) { this.state = 'getup'; this.st = 0; this.ev.push('getup'); }
    } else if (this.state === 'getup') {
      this.st += dt;
      const k = clamp(this.st / 0.45, 0, 1);
      this.th = 3.0 * (1 - smooth(k)); this.om = 0; this.al *= 0.9;
      if (k >= 1) { this.state = 'ok'; this.th = 0; this.al = 0; this.stam = Math.max(this.stam, 0.6); this.tired = 0; }
    }

    this.planted = this.state === 'ok' && this.th < 0.14 && this.al < 0.22 && this.jy <= 0;
    const et = this.slapT > 0 ? 1 : this.cock > 0 ? 0.48 : 0.62;
    const k = this.slapT > 0 ? 1100 : 260;
    this.extv += (k * (et - this.ext) - 1.5 * Math.sqrt(k) * this.extv) * dt; this.ext += this.extv * dt;

    if (this.jy > 0 || this.jv > 0) {
      this.jv -= 1500 * dt; this.jy += this.jv * dt;
      if (this.jy <= 0) { this.jy = 0; this.jv = 0; this.ev.push('land'); }
    }

    // secondary motion + face
    this.bow += (this.bowT - this.bow) * Math.min(1, dt * 10);
    this.wag += dt * (5 + 22 * this.excite);
    this.wph += dt * 13 * this.walk;
    const jolt = (this.om - oth) / dt;
    this.earV += (-70 * this.earA - 7 * this.earV - jolt * 0.35 - this.om * 9 + this.jv * 0.03) * dt; this.earA += this.earV * dt;
    this.dangV += (-45 * this.dang - 5 * this.dangV - jolt * 0.3 - this.om * 6) * dt; this.dang += this.dangV * dt;
    this.earA = clamp(this.earA, -1.2, 1.2); this.dang = clamp(this.dang, -1, 1);
    this.faceA += (this.faceT - this.faceA) * Math.min(1, dt * 9);
    this.blink -= dt; if (this.blink < -0.12) this.blink = rnd(1.5, 4.5);
    if (this.emote && (this.emote.t -= dt) <= 0) this.emote = null;

    this.pose();
    this.pawV.x = (this.paw.x - ox) / dt; this.pawV.y = (this.paw.y - oy) / dt;
  }

  pose() {
    const b = this.b, d = this.dir;
    const r = smooth(clamp(this.th / 1.3, 0, 1));            // how reared-up
    const fk = smooth(clamp((this.th - 1.8) / 1.0, 0, 1));   // how flopped-over
    const bob = this.walk * Math.abs(Math.sin(this.wph)) * 4;
    const X = this.x + this.xo;
    const hx = X - d * this.shift * (1 - r) - d * fk * 26;
    const hh = lerp(b.hipH * (1 - 0.1 * r), b.thick * 0.5, fk);
    const hy = GROUND - hh - this.jy - bob;
    const th = this.th - this.bow * 0.42 * (1 - r);
    this.r = r; this.fk = fk; this.pth = th;
    this.hip.x = hx; this.hip.y = hy;
    const sx = hx + d * b.bodyL * Math.cos(th), sy = hy - b.bodyL * Math.sin(th);
    this.sh.x = sx; this.sh.y = sy;
    const ha = th + lerp(0.7, -0.3, r) + this.bow * 0.55;
    this.head.x = sx + d * b.neck * Math.cos(ha); this.head.y = sy - b.neck * Math.sin(ha);
    const hd = d * this.headDir, fa = this.faceA, nl = b.headR * 0.55 + b.snout;
    this.nose.x = this.head.x + hd * nl * Math.cos(fa); this.nose.y = this.head.y - nl * Math.sin(fa);
    this.face.x = (this.head.x + this.nose.x) / 2; this.face.y = (this.head.y + this.nose.y) / 2;
    if (this.planted) {
      this.paw.x = sx + d * 3; this.paw.y = GROUND - b.pawR * 0.45 - (this.jy > 0 ? this.jy : 0);
    } else {
      const len = b.armL * this.ext;
      this.paw.x = sx + d * len * Math.sin(this.al);
      this.paw.y = Math.min(sy + len * Math.cos(this.al), GROUND - b.pawR * 0.45);
    }
  }

  get up() { return this.state === 'ok' && (this.th > 0.75 || this.jy > 12); }
  get offering() { return this.state === 'ok' && this.th > 0.7 && this.al > 0.8 && !this.planted; }
}

// What is touching what, right now?
function contacts(a, b) {
  const out = [];
  if (!a.planted && !b.planted && dist(a.paw, b.paw) < a.b.pawR + b.b.pawR + 2) {
    out.push({
      type: 'paw', x: (a.paw.x + b.paw.x) / 2, y: (a.paw.y + b.paw.y) / 2,
      speed: Math.hypot(a.pawV.x - b.pawV.x, a.pawV.y - b.pawV.y), high: a.up && b.up,
    });
  }
  for (const [p, q] of [[a, b], [b, a]]) {
    if (p.planted || p.state !== 'ok' || q.state !== 'ok') continue;
    const sp = Math.hypot(p.pawV.x, p.pawV.y);
    if (p.slapT > 0 && dist(p.paw, q.face) < p.b.pawR + q.b.headR * 0.8) {   // only a real swing boops
      out.push({ type: 'boop', by: p, on: q, x: q.nose.x, y: q.nose.y, speed: sp });
    }
  }
  return out;
}

const SIM = { W, H, GROUND, PX, TH0, BREEDS, ORDER, Dog, contacts, partnerX, clamp, lerp, smooth, rnd, dist, noise };
if (typeof module !== 'undefined') module.exports = SIM;

// ═══ brain.js ═══
// ───────────────────────── Doggy High Five: dog brain ─────────────────────────
// The partner genuinely wants the high five. It drives the exact same wobbly
// body you do (lean / paw / slap), just with dog-grade judgement.

class Brain {
  constructor(dog, other, ai) {
    this.d = dog; this.o = other; this.ai = ai || dog.b.ai;
    this.s = 'idle'; this.t = 0; this.dur = rnd(0.5, 1.1);
    this.hist = []; this.ready = 0; this.react = rnd(this.ai.react[0], this.ai.react[1]);
    this.blindA = 1.8; this.nextSwing = 1.2; this.fails = 0; this.seed = rnd(100);
    this.barkT = 0; this.sawSq = false; this.sqGone = 0; this.sneezed = false; this.reBlind = false;
  }

  set(s, dur = 0) { this.s = s; this.t = 0; this.dur = dur; this.ready = 0; this.sneezed = false; }
  idle(extra = 0) { this.set('idle', rnd(this.ai.idle[0], this.ai.idle[1]) + extra); }
  boop() { this.set('booped'); }

  lookAt(p) {
    const d = this.d;
    return clamp(Math.atan2(d.head.y - p.y, d.dir * d.headDir * (p.x - d.head.x)), -0.7, 1.2);
  }

  update(dt, world) {
    const d = this.d, o = this.o, ai = this.ai, inp = d.inp;
    inp.lean = 0; inp.paw = -0.4; inp.slap = false; inp.hop = false;
    d.cock = 0; d.bowT = 0; d.spin = 1; d.headDir = 1;
    this.t += dt;
    this.hist.push(world.time, o.paw.x, o.paw.y);
    if (this.hist.length > 300) this.hist.splice(0, 3);
    d.faceT = this.lookAt(o.head);
    d.excite = lerp(d.excite, 0.35, dt);
    if (this.s === 'wait') return;
    if (d.state !== 'ok') { if (this.s !== 'fallen') this.set('fallen'); d.mood = 'derp'; return; }

    if (world.squirrel) {
      this.sqGone = 0;
      if (!this.sawSq) {
        this.sawSq = true;
        if (rnd() < ai.squirrel && this.s !== 'celebrate') { this.set('squirrel'); d.say('SQUIRREL!!', 1.5); d.ev.push('bark'); }
      }
    } else { this.sawSq = false; this.sqGone += dt; }

    switch (this.s) {
      case 'fallen': d.mood = 'happy'; this.fails++; this.over = false; this.idle(0.3); break;
      case 'idle':
        d.mood = 'happy';
        if (o.offering) this.t += dt * 1.5;                 // "oh!! you're doing it!!"
        if (this.t > this.dur) {
          if (rnd() < ai.quirk && !o.offering) this.quirk();
          else this.set('wiggle', rnd(0.45, 0.8));
        }
        break;
      case 'wiggle':                                         // the tell: butt up, tail going
        d.bowT = 1; d.mood = 'eager'; d.excite = lerp(d.excite, 1, dt * 5);
        if (this.t > this.dur) { this.set('up'); this.over = rnd() < (ai.flop || 0); d.ev.push('boof'); }
        break;
      case 'up':
        inp.lean = this.balance(world); d.mood = 'eager';
        if (d.th > 0.95) {
          this.set('offer', rnd(ai.offer[0], ai.offer[1]));
          this.blindA = rnd(1.25, 2.45); this.nextSwing = rnd(1.1, 1.6);
        } else if (this.t > 2) this.idle();
        break;
      case 'offer': this.offer(dt, world); break;
      case 'down':
        inp.lean = -0.7; inp.paw = -1;
        if (d.th < 0.08) this.idle();
        break;
      case 'squirrel': {
        const sq = world.squirrel;
        inp.lean = -1; inp.paw = -1; d.mood = 'alert'; d.excite = 1;
        if (sq) {
          d.headDir = d.dir * (sq.x - d.head.x) < 0 ? -1 : 1;
          d.faceT = this.lookAt(sq);
          this.barkT -= dt;
          if (this.barkT <= 0) { this.barkT = rnd(0.35, 0.6); d.ev.push('bark'); }
        } else if (this.sqGone > 0.4) this.idle(0.2);
        break;
      }
      case 'booped':
        d.mood = 'squint'; inp.lean = -1; inp.paw = -1;
        if (this.t > 0.3 && !this.sneezed) { this.sneezed = true; d.say('ACHOO!', 0.8); d.ev.push('sneeze'); }
        if (this.t > 1.1) this.idle();
        break;
      case 'celebrate':
        d.excite = 1; d.mood = 'joy'; inp.lean = -0.5; inp.paw = -1;
        if (d.th < 0.1) d.bowT = Math.sin(this.t * 9) > 0 ? 1 : 0;
        break;
      case 'spin':                                           // tail. TAIL. get the tail
        d.spin = Math.floor(this.t / 0.13) % 2 ? -1 : 1; d.mood = 'derp';
        if (this.t > this.dur) this.idle();
        break;
      case 'shake':                                          // wrong trick, buddy
        inp.paw = clamp(7 * (1.35 - d.al) - 0.9 * d.alv, -1, 1);
        if (this.t > this.dur) this.idle();
        break;
      case 'bork': if (this.t > this.dur) this.idle(0); break;
      case 'snub':
        d.headDir = -1; d.faceT = 0.4; d.mood = 'snooty';
        if (this.t > this.dur) this.idle();
        break;
      case 'zoom': {
        const k = clamp(this.t / this.dur, 0, 1);
        d.xo = -d.dir * 430 * Math.sin(Math.PI * k); d.walk = 1; d.spin = k < 0.5 ? -1 : 1; d.excite = 1; d.mood = 'joy';
        if (k >= 1) { d.xo = 0; d.walk = 0; this.idle(); }
        break;
      }
    }
  }

  quirk() {
    const d = this.d, qs = this.ai.quirks, q = qs[Math.floor(rnd(qs.length))];
    if (q === 'spin') { this.set('spin', rnd(0.9, 1.4)); d.say('?!', 1); d.ev.push('whine'); }
    else if (q === 'shake') { this.set('shake', rnd(1.6, 2.2)); d.say('shake?', 1.6); }
    else if (q === 'bork') { this.set('bork', 0.7); d.say('BORK', 0.7); d.ev.push('bark'); }
    else if (q === 'snub') { this.set('snub', rnd(1.4, 2)); d.say('. . .', 1.4); }
    else if (q === 'zoom') { this.set('zoom', 1.5); d.say('ZOOMIES', 1.2); d.ev.push('bark'); }
  }

  balance(world) {
    const d = this.d;
    if (d.th < 0.95) return d.th < 0.6 ? 1 : 0.7;
    if (this.over) return 1;                                 // too much enthusiasm, not enough brakes
    const n = noise(world.time * 2.3 + this.seed) * this.ai.wob * 0.14;
    return clamp(5 * (TH0 + n - d.th) - 1.1 * d.om, -1, 1);
  }

  aim(world) {
    const d = this.d, o = this.o, ai = this.ai, b = d.b;
    if (ai.aim === 'blind') {
      return { x: d.sh.x + d.dir * b.armL * Math.sin(this.blindA), y: d.sh.y + b.armL * Math.cos(this.blindA) };
    }
    const pa = (ai.pose || 2.0) + (o.offering ? 0 : 0.25 * Math.sin(world.time * 6));   // "c'mon!" wave
    const def = { x: d.sh.x + d.dir * b.armL * 0.62 * Math.sin(pa), y: d.sh.y + b.armL * 0.62 * Math.cos(pa) };
    if (!o.offering) return def;
    // aim at where their paw was a moment ago, give or take
    const tt = world.time - ai.lag;
    let i = this.hist.length - 3;
    while (i > 0 && this.hist[i] > tt) i -= 3;
    const tp = {
      x: this.hist[i + 1] + noise(world.time * 1.3 + this.seed) * ai.err,
      y: this.hist[i + 2] + noise(world.time * 1.7 + this.seed * 2) * ai.err,
    };
    if (ai.aim === 'fixed') {                               // condescends, eventually, mostly
      const k = clamp((this.t - 1.5) / 3, 0, 0.85);
      tp.x = lerp(def.x, tp.x, k); tp.y = lerp(def.y, tp.y, k);
    }
    return tp;
  }

  offer(dt, world) {
    const d = this.d, o = this.o, ai = this.ai, inp = d.inp, b = d.b;
    inp.lean = this.balance(world);
    if (ai.aim === 'hop') inp.hop = d.th > 0.8;
    d.excite = lerp(d.excite, o.offering ? 1 : 0.6, dt * 3);
    d.mood = 'eager';
    const tp = this.aim(world);
    const vx = tp.x - d.sh.x, vy = tp.y - d.sh.y;
    const want = clamp(Math.atan2(d.dir * vx, vy), 0.35, 2.85);
    inp.paw = clamp(7 * (want - d.al) - 0.9 * d.alv, -1, 1);
    d.faceT = this.lookAt(o.offering ? o.paw : d.paw);

    let go = false;
    if (ai.aim === 'blind') {
      if (this.t > this.nextSwing - 0.5) d.cock = 1;
      if (this.t > this.nextSwing) { go = true; this.nextSwing = this.t + rnd(1.3, 1.8); this.reBlind = true; }
      else if (this.reBlind && d.slapT <= 0 && d.slapCd < 0.3) { this.reBlind = false; this.blindA = rnd(1.25, 2.45); }
    } else {
      // would a slap along my current paw line actually land on their paw?
      const rx = o.paw.x - d.sh.x, ry = o.paw.y - d.sh.y, ds = Math.hypot(rx, ry);
      const real = Math.atan2(d.dir * rx, ry);
      const ok = o.offering && Math.abs(real - d.al) < 0.2 && ds < b.armL + b.pawR + o.b.pawR - 3 && ds > b.armL * 0.45;
      this.ready = ok ? this.ready + dt : Math.max(0, this.ready - dt * 2);
      if (this.ready > 0.02) d.cock = 1;
      if (this.ready > this.react) { go = true; this.ready = 0; this.react = rnd(ai.react[0], ai.react[1]); }
      if (!o.offering && this.t > this.nextSwing) {          // impatient practice swing at nothing
        go = true; this.nextSwing = this.t + rnd(1.6, 2.6);
        if (rnd() < 0.5) d.say('?', 0.8);
      }
    }
    if (go && d.slapCd <= 0) inp.slap = true;
    if (this.t > this.dur || d.tired > 0 || d.th < 0.5) {
      this.fails++; d.mood = 'sad';
      if (rnd() < 0.35) d.ev.push('whine');
      this.set('down');
    }
  }
}

// ═══ draw-dog.js ═══
// ───────────────────────── Doggy High Five: dog renderer ─────────────────────────
// Webcomic rules: potato bodies, noodle limbs, flat colour, one wobbly black ink line.
const OUT = '#1d1a18', LW = 3.3;
let BOIL = 0;   // ticks ~9x a second so the ink wobbles like hand re-drawn frames

function jit(seed, i, amp = 1) {
  const s = Math.sin(seed * 12.9898 + i * 78.233 + BOIL * 37.719) * 43758.5453;
  return ((s - Math.floor(s)) * 2 - 1) * amp;
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const c = (v) => clamp(Math.round(v * k), 0, 255);
  return `rgb(${c((n >> 16) & 255)},${c((n >> 8) & 255)},${c(n & 255)})`;
}
function ink(g, fill, lw = LW) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (lw) { g.lineWidth = lw; g.strokeStyle = OUT; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }
}
// Closed smooth curve that uses the points as control handles: instant lumpy potato.
function blobPath(g, p) {
  const n = p.length / 2;
  const mx = (i) => (p[(i % n) * 2] + p[((i + 1) % n) * 2]) / 2, my = (i) => (p[(i % n) * 2 + 1] + p[((i + 1) % n) * 2 + 1]) / 2;
  g.beginPath(); g.moveTo(mx(n - 1), my(n - 1));
  for (let i = 0; i < n; i++) g.quadraticCurveTo(p[i * 2], p[i * 2 + 1], mx(i), my(i));
  g.closePath();
}
function wobble(pts, seed, amp = 0.9) {
  const p = pts.slice();
  for (let i = 0; i < p.length; i++) p[i] += jit(seed, i, amp);
  return p;
}
function lump(g, pts, fill, seed = 0, amp = 0.9, lw = LW) { blobPath(g, amp ? wobble(pts, seed, amp) : pts); ink(g, fill, lw); }
function blob(g, x, y, rx, ry, col, rot = 0, lw = LW) {
  g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, 7); ink(g, col, lw);
}
// A limb with no bones in it: curves from a to b, passing through the "knee" k.
function noodle(g, ax, ay, kx, ky, bx, by, w, col) {
  const cx = 2 * kx - (ax + bx) / 2, cy = 2 * ky - (ay + by) / 2;
  g.lineCap = 'round';
  for (const [lw, c] of [[w + LW * 2, OUT], [w, col]]) {
    g.beginPath(); g.moveTo(ax, ay); g.quadraticCurveTo(cx, cy, bx, by); g.lineWidth = lw; g.strokeStyle = c; g.stroke();
  }
}
function ik2(ax, ay, bx, by, l1, l2, s) {
  const dx = bx - ax, dy = by - ay, dd = Math.hypot(dx, dy) || 1e-6;
  const m = Math.min(dd, l1 + l2 - 0.01);
  const a = (l1 * l1 - l2 * l2 + m * m) / (2 * m);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / dd, uy = dy / dd;
  return { x: ax + ux * a - uy * h * s, y: ay + uy * a + ux * h * s };
}
// Where a noodle limb bows out. Like ik2, but the bulge is capped (noodles curve, they don't fold),
// and `s` can be any value in [-1, 1] so the bend can sweep smoothly from one side to the other.
function knee(ax, ay, bx, by, half, s, k = 0.17) {
  const dx = bx - ax, dy = by - ay, dd = Math.hypot(dx, dy) || 1e-6;
  const m = Math.min(dd, 2 * half);
  const h = Math.min(Math.sqrt(Math.max(0, half * half - (m * m) / 4)), k * dd + 4) * s;
  return { x: ax + dx / 2 - (dy / dd) * h, y: ay + dy / 2 + (dx / dd) * h };
}
// Big dumb oval foot with two toe ticks. (x, y) is where it touches the ground.
function foot(g, x, y, dr, w, col, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot);
  blob(g, dr * w * 0.3, -w * 0.34, w * 0.82, w * 0.5, col);
  g.lineWidth = 2; g.beginPath();
  g.moveTo(dr * w * 0.8, -w * 0.62); g.lineTo(dr * w * 0.72, -w * 0.28);
  g.moveTo(dr * w * 0.46, -w * 0.76); g.lineTo(dr * w * 0.42, -w * 0.44); g.stroke();
  g.restore();
}

function drawShadow(g, d) {
  const cx = (d.hip.x + d.sh.x) / 2, w = Math.abs(d.sh.x - d.hip.x) / 2 + d.b.thick * 0.75, k = 1 / (1 + d.jy / 60);
  g.fillStyle = 'rgba(70,105,40,.34)';
  g.beginPath(); g.ellipse(cx, GROUND + 3, w * k, 7 * k, 0, 0, 7); g.fill();
}

function drawTail(g, d, bx, by, ux, uy) {
  const b = d.b, dr = d.dir, T = b.thick;
  const wagA = Math.sin(d.wag) * (0.25 + 0.6 * d.excite);
  const th = Math.atan2(-uy, ux * dr);
  const base = lerp(Math.PI - 1.0 + 0.35 * th, th + Math.PI + 0.3, d.fk) + wagA;   // up-and-back, whatever the body is doing
  const dv = (a, l) => [dr * Math.cos(a) * l, -Math.sin(a) * l];
  let L = T * 0.3;
  if (b.tail === 'nub') { const [vx, vy] = dv(base, T * 0.2); blob(g, bx + vx, by + vy, T * 0.2, T * 0.17, b.fur); }
  else {
    L = b.tail === 'plume' ? T * 1.2 : b.tail === 'whip' ? T * 1.35 : T * 0.95;
    const [ax, ay] = dv(base, L * 0.55), [cx, cy] = dv(base + (b.tail === 'curl' ? 1.7 : 0.5) + wagA * 0.6, L * 0.5);
    const mx = bx + ax, my = by + ay, ex = mx + cx, ey = my + cy;
    if (b.tail === 'plume') {   // fluffy flag
      const px = -(ey - by), py = ex - bx, pl = Math.hypot(px, py) || 1, wx = (px / pl) * T * 0.3, wy = (py / pl) * T * 0.3;
      lump(g, [bx, by, mx + wx, my + wy, ex + wx * 0.4, ey + wy * 0.4, ex + cx * 0.3, ey + cy * 0.3, mx - wx, my - wy], b.belly, d.seed + 5, 1);
    } else noodle(g, bx, by, mx, my, ex, ey, b.tail === 'whip' ? T * 0.09 : T * 0.13, b.fur);
  }
  if (d.excite > 0.55 && d.fk < 0.3) {   // wag marks
    const wa = Math.atan2(-Math.sin(base), dr * Math.cos(base));
    g.lineWidth = 2.2; g.strokeStyle = OUT; g.lineCap = 'round';
    for (const s of [-1, 1]) { g.beginPath(); g.arc(bx, by, L * 0.95 + 8, wa + s * 0.5, wa + s * 0.85, s < 0); g.stroke(); }
  }
}

// The paws are the whole game, so a raised high-five arm gets inked on top of everybody.
function drawArm(g, d) {
  if (d.planted) return;
  const b = d.b, dr = d.dir, sh = d.sh, half = b.armL / 2, armW = Math.max(5, b.thick * 0.16);
  g.save();
  if (d.spin < 0) { const cx = (d.hip.x + sh.x) / 2; g.translate(cx, 0); g.scale(-1, 1); g.translate(-cx, 0); }
  // elbow points forward while the paw hangs, and down once the paw is raised: never out of the back
  const side = dr * clamp((d.al - 0.55) / 0.45, -1, 1);
  const el = knee(sh.x + dr * 4, sh.y, d.paw.x, d.paw.y, half, side, 0.3);
  noodle(g, sh.x + dr * 4, sh.y, el.x, el.y, d.paw.x, d.paw.y, armW, b.fur);
  const pr = b.pawR * 1.25, dx = dr * Math.sin(d.al), dy = Math.cos(d.al), pa = Math.atan2(dy, dx);
  if (d.slapT > 0) {   // speed lines
    g.lineWidth = 2.6; g.strokeStyle = OUT; g.lineCap = 'round'; g.beginPath();
    for (let i = -1; i <= 1; i++) {
      const ox = -dy * i * pr * 0.8, oy = dx * i * pr * 0.8, l0 = pr + 6, l1 = pr + 22 + (i ? 0 : 12);
      g.moveTo(d.paw.x - dx * l0 + ox, d.paw.y - dy * l0 + oy); g.lineTo(d.paw.x - dx * l1 + ox, d.paw.y - dy * l1 + oy);
    }
    g.stroke();
  }
  blob(g, d.paw.x, d.paw.y, pr, pr * 0.94, b.belly, pa);
  blob(g, d.paw.x - dx * pr * 0.2 + dr, d.paw.y - dy * pr * 0.2, pr * 0.42, pr * 0.36, '#f06a86', 0, 0);
  for (let i = -1; i <= 1; i++) blob(g, d.paw.x + Math.cos(pa + i * 0.75) * pr * 0.58 + dr, d.paw.y + Math.sin(pa + i * 0.75) * pr * 0.58, pr * 0.19, pr * 0.19, '#f06a86', 0, 0);
  g.restore();
}

function drawDog(g, d, time) {
  BOIL = Math.floor(time * 9);
  const b = d.b, dr = d.dir, hip = d.hip, sh = d.sh, th = d.pth, fk = d.fk, r = d.r, T = b.thick, L = b.bodyL, sd = d.seed;
  const far = b._far || (b._far = shade(b.fur, 0.8));
  const ux = dr * Math.cos(th), uy = -Math.sin(th), nx = dr * Math.sin(th), ny = Math.cos(th);
  const gy = GROUND - d.jy;
  drawShadow(g, d);
  g.save();
  if (d.spin < 0) { const cx = (hip.x + sh.x) / 2; g.translate(cx, 0); g.scale(-1, 1); g.translate(-cx, 0); }

  const legL = Math.max(b.hipH * 0.62, T * 0.36), legW = Math.max(5, T * 0.17), armW = Math.max(5, T * 0.16);
  const half = b.armL / 2, fw = Math.max(9, T * 0.3);
  // hind feet: planted, trotting, or (when flopped) kicking at the sky
  const hind = (i) => {
    const ph = d.wph + i * Math.PI;
    const fx = hip.x + dr * (i ? 12 : -4) + d.walk * Math.sin(ph) * 13, fy = gy - d.walk * Math.max(0, Math.cos(ph)) * 9;
    const a = 1.25 + 0.45 * Math.sin(time * 11 + i * 2.1);
    const x = lerp(fx, hip.x + dr * Math.cos(a) * legL * 1.7, fk), y = lerp(fy, hip.y - Math.sin(a) * legL * 1.7, fk);
    const hx = hip.x + dr * (i ? 6 : 0), hy = hip.y + T * 0.2 * (1 - fk), k = knee(hx, hy, x, y, legL, -dr);
    return [hx, hy, k.x, k.y, x, y];
  };
  // near front leg: on the ground, or dangling like a begging T-rex
  const dangle = smooth(clamp(r * 4 + fk + (d.jy > 0 ? 1 : 0), 0, 1));
  const fa = lerp(0, 0.95, r) + d.dang * 0.7 * dangle + fk * (1.5 + 0.4 * Math.sin(time * 12 + 1));
  const fL = lerp(Math.max(8, gy - sh.y), b.armL * 0.66, dangle);
  const ffx = sh.x - dr * 9 * (1 - dangle) + dr * fL * Math.sin(fa) + d.walk * Math.sin(d.wph + 2) * 12 * (1 - dangle);
  const ffy = Math.min(sh.y + fL * Math.cos(fa), GROUND);
  const fe = knee(sh.x, sh.y + T * 0.12, ffx, ffy, half, dr);
  const hf = hind(1), hn = hind(0);

  noodle(g, hf[0], hf[1], hf[2], hf[3], hf[4], hf[5], legW, far);
  foot(g, hf[4], hf[5], dr, fw, far, -dr * fk * 1.3);

  // the high-five leg, while it is still just a leg (once lifted, drawArm inks it on top of everyone)
  if (d.planted) {
    const el = knee(sh.x + dr * 4, sh.y, d.paw.x, d.paw.y, half, dr);
    noodle(g, sh.x + dr * 4, sh.y, el.x, el.y, d.paw.x, d.paw.y, armW, far);
    foot(g, d.paw.x, d.paw.y + b.pawR * 0.45, dr, fw * 0.92, far);
  }

  drawTail(g, d, hip.x - ux * T * 0.42, hip.y - uy * T * 0.42, ux, uy);

  // the potato
  const P = (a, s) => [hip.x + ux * a * L + nx * s * T, hip.y + uy * a * L + ny * s * T];
  const sag = 0.8 + (b.fat || 0) + 0.05 * Math.sin(time * 9 + sd) * d.excite;
  const body = wobble([].concat(P(-0.26, -0.05), P(-0.12, -0.62), P(0.5, -0.54), P(1.05, -0.54), P(1.22, 0.05), P(1.02, 0.62), P(0.5 + d.dang * 0.14, sag), P(-0.1, 0.68)), sd, 0.9);
  const ba = Math.atan2(uy, ux), bc = P(0.52, 0.64);
  g.save(); blobPath(g, body); g.fillStyle = b.fur; g.fill(); g.clip();
  if (b.shag) { const rc = P(-0.05, 0); g.beginPath(); g.ellipse(rc[0], rc[1], L * 0.5, T, ba, 0, 7); g.fillStyle = '#a4a9b3'; g.fill(); }
  g.beginPath(); g.ellipse(bc[0], bc[1], L * 0.55, T * 0.42, ba, 0, 7); g.fillStyle = b.belly; g.fill();
  g.restore(); blobPath(g, body); ink(g, null);

  noodle(g, hn[0], hn[1], hn[2], hn[3], hn[4], hn[5], legW, b.fur);
  foot(g, hn[4], hn[5], dr, fw, b.belly, -dr * fk * 1.3);
  if (d.state === 'ok' && d.th > 0.55 && d.stam < 0.3) {   // knees are filing a complaint
    g.lineWidth = 2; g.strokeStyle = OUT; g.beginPath();
    for (const s of [-1, 1]) { const x0 = hn[2] + s * (legW + 9) + jit(sd, 60 + s, 1.5); g.moveTo(x0, hn[3] - 8); g.lineTo(x0 + 4, hn[3] - 3); g.lineTo(x0, hn[3] + 2); g.lineTo(x0 + 4, hn[3] + 7); }
    g.stroke();
  }

  // collar + tag
  const cx = lerp(sh.x, d.head.x, 0.42), cy = lerp(sh.y, d.head.y, 0.42);
  const nl = Math.hypot(d.head.x - sh.x, d.head.y - sh.y) || 1, px = (-(d.head.y - sh.y) / nl) * T * 0.4, py = ((d.head.x - sh.x) / nl) * T * 0.4;
  const cw = Math.max(5, b.headR * 0.28);
  g.lineCap = 'round';
  for (const [lw, c] of [[cw + LW * 2, OUT], [cw, b.collar]]) { g.beginPath(); g.moveTo(cx - px, cy - py); g.lineTo(cx + px, cy + py); g.lineWidth = lw; g.strokeStyle = c; g.stroke(); }
  const low = py > 0 ? 1 : -1;
  blob(g, cx + px * low, cy + py * low + cw * 0.7, Math.max(3, cw * 0.5), Math.max(3, cw * 0.5), '#ffd84a', 0, 2.2);

  drawFace(g, d, time);

  noodle(g, sh.x, sh.y + T * 0.12, fe.x, fe.y, ffx, ffy, armW, b.fur);
  foot(g, ffx, ffy, dr, fw * 0.9, b.belly, dr * dangle * 0.9);
  g.restore();
  drawEmote(g, d);
}

// ═══ draw-face.js ═══
// ───────────────────────── Doggy High Five: faces ─────────────────────────
// Bug eyes that never quite agree, a mouth that is mostly teeth and tongue.

function drawEar(g, d, R, front) {
  const b = d.b, col = front ? b.earC : shade(b.earC, 0.8), a = d.earA;
  g.save();
  if (b.ear === 'flop' || b.ear === 'shag') {
    g.translate(-R * 0.5, -R * 0.7); g.rotate(a * 0.9 + 0.3);
    lump(g, [-R * 0.38, -R * 0.12, R * 0.42, -R * 0.16, R * 0.52, R * 0.7, R * 0.1, R * 1.55, -R * 0.48, R * 1.38, -R * 0.62, R * 0.55], col, d.seed + 20, 0.8);
  } else {
    const bat = b.ear === 'bat', hgt = bat ? R * 1.7 : R * 1.05, wid = bat ? R * 0.7 : R * 0.46;
    g.translate(-R * (front ? 0.5 : 0.05), -R * 0.75); g.rotate(a * 0.35 - (bat ? 0.55 : 0.25));
    g.beginPath(); g.moveTo(-wid, R * 0.25); g.quadraticCurveTo(-wid * 0.7, -hgt * 0.8, jit(d.seed, 21, 1), -hgt);
    g.quadraticCurveTo(wid * 0.9, -hgt * 0.45, wid, R * 0.25); g.closePath(); ink(g, col);
    if (bat && front) {
      g.beginPath(); g.moveTo(-wid * 0.45, R * 0.15); g.quadraticCurveTo(-wid * 0.3, -hgt * 0.6, 0, -hgt * 0.78);
      g.quadraticCurveTo(wid * 0.5, -hgt * 0.35, wid * 0.5, R * 0.15); g.closePath(); g.fillStyle = '#f3a9a0'; g.fill();
    }
  }
  g.restore();
}

function drawEyes(g, d, R, time) {
  const m = d.mood, sd = d.seed;
  const k = m === 'alert' ? 1.3 : m === 'eager' ? 1.15 : m === 'derp' ? 1.12 : m === 'sad' || m === 'snooty' ? 0.92 : 1;
  const eyes = [[R * 0.76, -R * 0.76, R * 0.3 * k, 1], [R * 0.2, -R * 0.72, R * 0.4 * k, 0]];   // far eye, then near eye
  for (const [x, y, rad, farEye] of eyes) {
    if (m === 'squint') {   // ✕ ✕
      g.beginPath(); g.moveTo(x - rad * 0.6, y - rad * 0.6); g.lineTo(x + rad * 0.6, y + rad * 0.6);
      g.moveTo(x + rad * 0.6, y - rad * 0.6); g.lineTo(x - rad * 0.6, y + rad * 0.6); ink(g, null, 3.4);
      continue;
    }
    if (m === 'joy' || (d.blink < 0 && m !== 'alert' && m !== 'derp')) {
      g.beginPath(); g.arc(x, y + rad * 0.3, rad * 0.75, Math.PI * 1.12, Math.PI * 1.88); ink(g, null, 3.4);
      continue;
    }
    blob(g, x + jit(sd, 40 + farEye, 0.5), y + jit(sd, 42 + farEye, 0.5), rad, rad * 0.96, '#fff', 0, 2.8);
    let px = rad * 0.38, py = rad * 0.05, pr = rad * 0.2;
    if (m === 'alert') { pr = rad * 0.1; px = rad * 0.3; }
    else if (m === 'eager') { pr = rad * 0.15; px = rad * 0.45; }
    else if (m === 'derp') { const a = time * 7 * (farEye ? -1 : 1) + farEye * 2; px = Math.cos(a) * rad * 0.5; py = Math.sin(a) * rad * 0.5; pr = rad * 0.16; }
    else if (m === 'sad') { px = rad * 0.2; py = rad * 0.45; }
    else if (m === 'snooty') { px = -rad * 0.35; py = rad * 0.1; }
    else { px += farEye ? rad * 0.12 : -rad * 0.12; py += farEye ? -rad * 0.22 : rad * 0.16; }   // permanently a bit wall-eyed
    g.fillStyle = OUT; g.beginPath(); g.arc(x + px, y + py, pr, 0, 7); g.fill();
    if (m === 'sad' || m === 'snooty') {   // heavy eyelid
      g.beginPath(); g.arc(x, y, rad, Math.PI * (m === 'sad' ? 1.12 : 0.98), Math.PI * (m === 'sad' ? 1.98 : 2.02)); g.closePath(); ink(g, d.b.fur, 2.6);
    }
    if (m === 'eager') { g.beginPath(); g.moveTo(x - rad * 0.7, y - rad * 1.25); g.lineTo(x + rad * 0.5, y - rad * 1.5); ink(g, null, 3.2); }
  }
  if (m === 'alert') {   // !!!
    g.beginPath();
    for (const a of [-2.0, -1.5, -1.0]) { g.moveTo(R * 0.3 + Math.cos(a) * R * 1.75, -R * 0.4 + Math.sin(a) * R * 1.75); g.lineTo(R * 0.3 + Math.cos(a) * R * 2.2, -R * 0.4 + Math.sin(a) * R * 2.2); }
    ink(g, null, 3);
  }
}

function drawFace(g, d, time) {
  const b = d.b, R = b.headR * 1.28, S = b.snout * 0.95, hd = d.dir * d.headDir, sd = d.seed, m = d.mood;
  const yap = clamp(1 - (time - (d.yapAt === undefined ? -9 : d.yapAt)) / 0.3, 0, 1);
  let open = m === 'joy' ? 0.95 : m === 'eager' ? 0.8 : m === 'derp' ? 0.7 : m === 'alert' ? 0.3 : m === 'happy' ? 0.42 + 0.2 * Math.sin(time * 15 + sd) : 0;
  open = Math.max(open, yap);
  const gx = -Math.sin(d.faceA), gyv = Math.cos(d.faceA);   // which way is "down" inside this tilted head
  g.save(); g.translate(d.head.x, d.head.y); g.scale(hd, 1); g.rotate(-d.faceA);
  const pointy = b.ear === 'point' || b.ear === 'bat';
  if (pointy) drawEar(g, d, R, false);

  // ── lower jaw, mouth cave, teeth, tongue, drool: all tucked under the muzzle ──
  const cx = 0, cy = R * 0.42, tx = R * 0.55 + S, ty = R * 0.36;
  const a0 = Math.atan2(ty - cy, tx - cx), len = Math.hypot(tx - cx, ty - cy), ja = a0 + open * 0.66;
  const jex = Math.cos(ja), jey = Math.sin(ja), jx = cx + jex * len * 0.9, jy = cy + jey * len * 0.9;
  if (open > 0.06) {
    g.save(); g.translate(cx, cy); g.rotate(ja);
    lump(g, [-R * 0.2, -R * 0.1, len * 0.5, -R * 0.12, len, -R * 0.02, len * 0.98, R * 0.3, len * 0.45, R * 0.42, -R * 0.25, R * 0.4], b.belly, sd + 11, 0.7);
    g.restore();
    g.beginPath(); g.moveTo(cx - R * 0.1, cy); g.lineTo(tx, ty); g.lineTo(jx, jy); g.closePath(); ink(g, '#7b1626');
    const ex = (tx - cx) / len, ey = (ty - cy) / len, tw = len * 0.12, tl = Math.min(R * 0.26, open * R * 0.55);
    g.fillStyle = '#fff'; g.lineWidth = 1.8; g.strokeStyle = OUT;
    for (let i = 0; i < 4; i++) {   // top teeth
      const t0 = 0.36 + i * 0.155, x0 = cx + ex * len * t0, y0 = cy + ey * len * t0;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + ex * tw, y0 + ey * tw); g.lineTo(x0 + ex * tw - ey * tl, y0 + ey * tw + ex * tl); g.lineTo(x0 - ey * tl, y0 + ex * tl); g.closePath(); g.fill(); g.stroke();
    }
    if (open > 0.25 && m !== 'alert') {   // tongue flops over the lip and hangs wherever gravity says
      const sx = cx + jex * len * 0.3, sy = cy + jey * len * 0.3, hx = jx + jex * R * 0.1, hy = jy + jey * R * 0.1;
      const tl2 = R * (0.38 + 0.1 * Math.sin(time * 15 + sd));
      noodle(g, sx, sy, hx - gx * R * 0.08, hy - gyv * R * 0.08, hx + gx * tl2 + R * (0.15 + d.dang * 0.5), hy + gyv * tl2, R * 0.23, '#f4849b');
    }
    if (m === 'happy' || m === 'eager' || m === 'derp') {   // drool
      const dl = R * (0.3 + 0.22 * Math.sin(time * 2.3 + sd)), dx0 = cx + jex * len * 0.55, dy0 = cy + jey * len * 0.55 + R * 0.3;
      g.beginPath(); g.moveTo(dx0, dy0); g.lineTo(dx0 + gx * dl, dy0 + gyv * dl); ink(g, null, 2);
      blob(g, dx0 + gx * (dl + R * 0.1), dy0 + gyv * (dl + R * 0.1), R * 0.1, R * 0.12, '#d6f1fa', 0, 2);
    }
  }

  // ── skull + muzzle, one lumpy shape ──
  const H = wobble([-R, -R * 0.1, -R * 0.6, -R * 1.05, R * 0.45, -R * 1.02, R * 0.8 + S * 0.2, -R * 0.42, R * 0.62 + S * 1.08, -R * 0.32,
    R * 0.62 + S * 1.12, R * 0.4, R * 0.3 + S * 0.3, R * 0.54, -R * 0.1, R, -R * 0.95, R * 0.72], sd + 3, 0.9);
  g.save(); blobPath(g, H); g.fillStyle = b.fur; g.fill(); g.clip();
  g.beginPath(); g.ellipse(R * 0.66 + S * 0.6, R * 0.22, S * 0.8 + R * 0.25, R * 0.54, 0, 0, 7); g.fillStyle = b.belly; g.fill();
  g.restore(); blobPath(g, H); ink(g, null);
  if (open <= 0.06) {   // closed mouth: a line with an opinion
    const sad = m === 'sad';
    g.beginPath(); g.moveTo(cx + R * 0.2, cy + (sad ? R * 0.14 : 0)); g.quadraticCurveTo((cx + tx) / 2, cy + (sad ? -R * 0.1 : R * 0.16), tx - R * 0.08, ty); ink(g, null, 2.8);
  }
  blob(g, R * 0.64 + S, -R * 0.2, R * 0.27, R * 0.21, OUT, 0.1, 0);
  blob(g, R * 0.6 + S, -R * 0.27, R * 0.08, R * 0.05, '#fff', 0, 0);
  g.fillStyle = OUT;
  for (const [wx, wy] of [[0.45, 0.1], [0.62, 0.2], [0.42, 0.29]]) { g.beginPath(); g.arc(R * 0.62 + S * wx, R * wy, 1.5, 0, 7); g.fill(); }

  if (b.shag) {   // a mop where the eyes should be
    lump(g, [-R * 0.55, -R * 1.2, R * 0.5, -R * 1.3, R * 1.1, -R * 0.65, R * 1.0, -R * 0.02, R * 0.45, -R * 0.2, -R * 0.05, -R * 0.32, -R * 0.65, -R * 0.6], '#fff', sd + 7, 1.2);
    g.beginPath();
    for (const hx of [0.1, 0.45, 0.78]) { g.moveTo(R * hx, -R * 0.95); g.quadraticCurveTo(R * (hx + 0.12), -R * 0.6, R * (hx + 0.02), -R * 0.32); }
    ink(g, null, 2);
  } else drawEyes(g, d, R, time);
  drawEar(g, d, R, true);
  g.restore();
}

function drawEmote(g, d) {
  const e = d.emote; if (!e) return;
  const k = Math.min(1, (e.max - e.t) * 9, e.t * 6), R = d.b.headR * 1.28, s = e.text.toUpperCase();
  g.save();
  g.translate(d.head.x - d.dir * 6, d.head.y - R * 1.5 - 30); g.scale(k, k); g.rotate(-d.dir * 0.06);
  g.font = `bold 17px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const w = g.measureText(s).width / 2 + 17, h = 19, tx = d.dir * 6;
  g.beginPath(); g.moveTo(tx - 6, h * 0.8); g.lineTo(tx + d.dir * 9, h + 15); g.lineTo(tx + 7, h * 0.8); ink(g, '#fff');
  lump(g, [-w * 1.12, 0, -w * 0.85, -h * 1.25, 0, -h * 1.4, w * 0.85, -h * 1.25, w * 1.12, 0, w * 0.85, h * 1.25, 0, h * 1.4, -w * 0.85, h * 1.25], '#fff', d.seed + 30, 0.8);
  g.beginPath(); g.moveTo(tx - 3.5, h * 0.98); g.lineTo(tx + 4.5, h * 0.98); g.lineWidth = 5.5; g.strokeStyle = '#fff'; g.stroke();
  g.fillStyle = OUT; g.fillText(s, 0, 1);
  g.restore();
}

// Flat colour, black ink, and not one straight line.
const FENCE_Y = 286;

function makeBackground(scale = 1) {
  const c = document.createElement('canvas'); c.width = Math.round(W * scale); c.height = Math.round(H * scale);
  const g = c.getContext('2d'); g.scale(c.width / W, c.height / H);
  let s = 11;
  const rr = () => ((s = (s * 16807) % 2147483647) / 2147483647), wb = (a = 1.5) => (rr() * 2 - 1) * a;
  const inkS = (fill, lw = 3) => { if (fill) { g.fillStyle = fill; g.fill(); } if (lw) { g.lineWidth = lw; g.strokeStyle = OUT; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); } };
  const potato = (cx, cy, rx, ry, n, wob, fill, lw) => {
    const p = [];
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, k = (1 + wb(wob)) * 1.1; p.push(cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k); }
    blobPath(g, p); inkS(fill, lw);
  };
  g.fillStyle = '#c8ebf4'; g.fillRect(0, 0, W, H);

  // the sun, who is thrilled to be here
  const SX = 838, SY = 84;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + 0.1, l = 76 + wb(6);
    g.beginPath(); g.moveTo(SX + Math.cos(a - 0.11) * 50, SY + Math.sin(a - 0.11) * 50); g.lineTo(SX + Math.cos(a) * l, SY + Math.sin(a) * l);
    g.lineTo(SX + Math.cos(a + 0.11) * 50, SY + Math.sin(a + 0.11) * 50); g.closePath(); inkS('#ffd23f', 2.6);
  }
  potato(SX, SY, 39, 39, 11, 0.03, '#ffe36e', 3);
  for (const [ex, er, px] of [[-13, 9, 2], [9, 7, -1.5]]) {
    g.beginPath(); g.arc(SX + ex, SY - 8, er, 0, 7); inkS('#fff', 2.2);
    g.fillStyle = OUT; g.beginPath(); g.arc(SX + ex + px, SY - 7, 2, 0, 7); g.fill();
  }
  g.beginPath(); g.moveTo(SX - 16, SY + 9); g.quadraticCurveTo(SX - 2, SY + 30, SX + 17, SY + 8); g.closePath(); inkS('#7b1626', 2.4);

  // hills
  g.beginPath(); g.moveTo(-10, 300);
  for (let x = 0; x <= W + 20; x += 20) g.lineTo(x, 262 + Math.sin(x * 0.008) * 26 + Math.sin(x * 0.021) * 10);
  g.lineTo(W + 10, 440); g.lineTo(-10, 440); g.closePath(); inkS('#a9d67f', 3);

  // trees: a stick and a cloud of leaves
  for (const [x, y, k, col] of [[92, 252, 1.1, '#6dbb57'], [252, 264, 0.8, '#5fae4d'], [640, 260, 0.9, '#6dbb57'], [742, 250, 1.15, '#5fae4d'], [908, 264, 0.85, '#6dbb57']]) {
    g.beginPath(); g.moveTo(x - 9 * k, y + 80 * k); g.lineTo(x - 7 * k + wb(1), y); g.lineTo(x + 7 * k + wb(1), y); g.lineTo(x + 9 * k, y + 80 * k); g.closePath(); inkS('#a8754a', 2.8);
    potato(x, y - 34 * k, 60 * k, 48 * k, 9, 0.1, col, 3);
    g.beginPath();
    for (let i = 0; i < 5; i++) { const ox = wb(34 * k), oy = wb(24 * k) - 34 * k; g.moveTo(x + ox - 7, y + oy); g.quadraticCurveTo(x + ox, y + oy - 9, x + ox + 7, y + oy); }
    inkS(null, 2);
  }

  // fence
  for (const ry of [FENCE_Y + 26, FENCE_Y + 84]) { g.beginPath(); g.rect(-6, ry, W + 12, 11); inkS('#c99f62', 2.6); }
  for (let x = -8; x < W; x += 40) {
    const h = FENCE_Y + wb(4), t = wb(1.5);
    g.beginPath(); g.moveTo(x + t, 412); g.lineTo(x + wb(1), h + 13); g.lineTo(x + 17 + wb(2), h); g.lineTo(x + 34 + wb(1), h + 13); g.lineTo(x + 34 + t, 412); g.closePath();
    inkS(rr() > 0.5 ? '#eccb8e' : '#e3bd7b', 2.8);
    g.fillStyle = OUT; g.beginPath(); g.arc(x + 17, h + 32, 1.8, 0, 7); g.arc(x + 17, h + 90, 1.8, 0, 7); g.fill();
    if (rr() > 0.45) { const gx = x + 8 + rr() * 18, y0 = h + 44 + rr() * 30; g.beginPath(); g.moveTo(gx, y0); g.quadraticCurveTo(gx + 3, y0 + 9, gx, y0 + 18); inkS(null, 1.6); }
  }

  // official signage
  g.save(); g.translate(168, 340); g.rotate(-0.045);
  g.beginPath(); g.roundRect(-74, -35, 148, 70, 6); inkS('#fff7df', 3);
  g.fillStyle = OUT; g.beginPath(); g.arc(-66, -27, 2, 0, 7); g.arc(66, -27, 2, 0, 7); g.fill();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `bold 23px ${FONT}`; g.fillText('DOG PARK', 0, -9);
  g.font = `bold 10.5px ${FONT}`; g.fillText('NO THUMBS ALLOWED', 0, 15);
  g.restore();

  // lawn
  g.beginPath(); g.moveTo(-10, 406);
  for (let x = 0; x <= W + 40; x += 40) g.lineTo(x, 405 + wb(2));
  g.lineTo(W + 10, H + 10); g.lineTo(-10, H + 10); g.closePath(); inkS('#aad36a', 3);
  g.beginPath();
  for (let i = 0; i < 44; i++) {
    const x = rr() * W, y = 420 + rr() * 110;
    g.moveTo(x - 6, y - 6); g.lineTo(x - 2, y); g.lineTo(x, y - 10); g.lineTo(x + 2, y); g.lineTo(x + 6, y - 6);
  }
  g.lineWidth = 2.2; g.strokeStyle = '#5f9440'; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke();
  for (let i = 0; i < 11; i++) {
    const x = rr() * W, y = 416 + rr() * 20 + (rr() > 0.5 ? 80 : 0), col = ['#fff', '#ffe36e', '#ff9ecb'][i % 3];
    for (let p = 0; p < 5; p++) { g.beginPath(); g.arc(x + Math.cos(p * 1.257) * 4, y + Math.sin(p * 1.257) * 4, 3, 0, 7); inkS(col, 1.5); }
    g.beginPath(); g.arc(x, y, 2.4, 0, 7); inkS('#f2a03d', 1.5);
  }

  // one tennis ball (unfetched), one bone (chewed), one hydrant (respected)
  g.beginPath(); g.arc(872, 494, 10, 0, 7); inkS('#d9f03c', 2.6);
  g.beginPath(); g.arc(864, 494, 9, -0.9, 0.9); inkS(null, 1.8);
  g.save(); g.translate(742, 508); g.rotate(-0.3);
  g.beginPath(); g.roundRect(-15, -4, 30, 8, 3);
  for (const [bx, by] of [[-16, -5], [-16, 5], [16, -5], [16, 5]]) { g.moveTo(bx + 6, by); g.arc(bx, by, 6, 0, 7); }
  inkS('#fff', 2.4); g.restore();
  g.beginPath(); g.roundRect(46, 386, 28, 44, 5); inkS('#e8553e', 2.8);
  g.beginPath(); g.roundRect(34, 402, 52, 11, 4); inkS('#e8553e', 2.8);
  g.beginPath(); g.roundRect(41, 378, 38, 11, 5); inkS('#e8553e', 2.8);
  g.beginPath(); g.arc(60, 377, 9, Math.PI, 0); g.closePath(); inkS('#e8553e', 2.8);
  return c;
}

const CLOUD = [-44, 10, -40, -18, -10, -16, -2, -38, 36, -38, 46, -14, 74, -14, 80, 12, 52, 26, 8, 26];
function drawClouds(g, time) {
  let i = 0;

function drawSquirrel(g, sq, time) {
  const hop = Math.abs(Math.sin(time * 15)) * 7;
  g.save(); g.translate(sq.x, FENCE_Y - 11 - hop); g.scale(sq.v > 0 ? 1.15 : -1.15, 1.15);
  lump(g, [-8, 6, -34, 12, -48, -18, -34, -44, -10, -38, -22, -18, -6, -6], '#b96a2e', 3, 0.8, 2.8);

  blob(g, 15, -10, 9.5, 8.5, '#cf8440', 0, 2.8);
  blob(g, 10, -19, 3, 4.8, '#cf8440', 0.3, 2.4);

  g.fillStyle = OUT; g.beginPath(); g.arc(19.8, -13.5, 1.4, 0, 7); g.arc(24.6, -9.5, 1.5, 0, 7); g.fill();
  g.beginPath(); g.rect(21.5, -6, 2.8, 4.2); ink(g, '#fff', 1.5);
  g.restore();
}

// ───────────────────────── Doggy High Five: lettering, particles, meters ─────────────────────────
const FONT = '"Comic Sans MS", "Chalkboard SE", "Comic Neue", "Marker Felt", "Segoe Print", cursive';

// Hand lettering: ALL CAPS, every letter slightly drunk, black outline, hard drop shadow.
function comic(g, s, x, y, size, col = '#fff', align = 'center', o = {}) {
  s = String(s).toUpperCase();
  g.font = `bold ${size}px ${FONT}`; g.textBaseline = 'middle'; g.lineJoin = 'round';
  const lw = o.lw === undefined ? Math.max(3, size * 0.2) : o.lw;
  if (size < 17) {
    g.textAlign = align;
    if (lw) { g.lineWidth = lw; g.strokeStyle = OUT; g.strokeText(s, x, y); }
    g.fillStyle = col; g.fillText(s, x, y);
    return;
  }
  const ws = []; let tot = 0;
  for (const ch of s) { const w = g.measureText(ch).width; ws.push(w); tot += w; }
  const x0 = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x;
  const sh = o.shadow === undefined ? Math.max(2, size * 0.07) : o.shadow;
  g.textAlign = 'center';
  for (let pass = lw ? 0 : 1; pass < 2; pass++) {
    let px = x0, i = 0;
    for (const ch of s) {
      const w = ws[i];
      if (ch !== ' ') {
        const h1 = Math.sin(i * 12.9898 + s.length * 4.1) * 43758.5453, h2 = Math.sin(i * 7.77 + s.length) * 1234.5;
        g.save(); g.translate(px + w / 2, y + ((h1 - Math.floor(h1)) * 2 - 1) * size * 0.045); g.rotate(((h2 - Math.floor(h2)) * 2 - 1) * 0.055);
        if (pass === 0) { g.lineWidth = lw; g.strokeStyle = OUT; if (sh) g.strokeText(ch, sh, sh); g.strokeText(ch, 0, 0); }
        else { g.fillStyle = col; g.fillText(ch, 0, 0); }
        g.restore();
      }
      px += w; i++;
    }
  }
}

const FX = {
  parts: [], pops: [], fl: null,
  clear() { this.parts.length = 0; this.pops.length = 0; this.fl = null; },
  add(p) { p.max = p.life; p.rot = p.rot || 0; p.vr = p.vr || 0; p.g = p.g === undefined ? 500 : p.g; this.parts.push(p); },
  flash(x, y) { this.fl = { x, y, t: 0 }; },   // the dramatic sunburst behind a successful high five
  burst(x, y, n, cols = ['#ffe36e', '#fff', '#ff9ecb', '#8fd9ff']) {
    for (let i = 0; i < n; i++) {
      const a = rnd(Math.PI * 2), v = rnd(120, 460);
      this.add({ type: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: rnd(0.5, 1.1), size: rnd(6, 13), col: cols[i % cols.length], vr: rnd(-9, 9) });
    }
  },
  ring(x, y, col = '#fff', size = 90) { this.add({ type: 'ring', x, y, vx: 0, vy: 0, life: 0.4, size, col, g: 0, rot: rnd(1) }); },
  dust(x, y, n = 5) {
    for (let i = 0; i < n; i++) this.add({ type: 'dust', x: x + rnd(-14, 14), y, vx: rnd(-70, 70), vy: rnd(-50, -10), life: rnd(0.3, 0.6), size: rnd(5, 10), col: '#fff', g: -30 });
  },
  hearts(x, y, n = 4) {
    for (let i = 0; i < n; i++) this.add({ type: 'heart', x: x + rnd(-20, 20), y: y + rnd(-10, 10), vx: rnd(-30, 30), vy: rnd(-90, -50), life: rnd(0.8, 1.4), size: rnd(7, 12), col: '#ff6b93', g: -20 });
  },
  sweat(x, y, dir) { this.add({ type: 'drop', x, y, vx: dir * rnd(40, 110), vy: rnd(-150, -70), life: 0.5, size: 5, col: '#bfe9f8' }); },
  confetti(n = 70) {
    const cols = ['#ff6b93', '#ffe36e', '#7bcf6b', '#7cc7ee', '#b98be8', '#fff'];
    for (let i = 0; i < n; i++) this.add({ type: i % 5 ? 'conf' : 'bone', x: rnd(W), y: rnd(-200, -10), vx: rnd(-40, 40), vy: rnd(60, 180), life: rnd(2.2, 3.6), size: rnd(7, 12), col: cols[i % cols.length], vr: rnd(-8, 8), g: 90 });
  },
  pop(text, x, y, o = {}) {
    this.pops.push({ text, x: clamp(x, 120, W - 120), y, t: 0, max: o.life || 1.2, size: o.size || 30, col: o.col || '#fff', rot: o.rot === undefined ? rnd(-0.12, 0.12) : o.rot, sub: o.sub, seed: rnd(50) });
  },
  update(dt) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.life -= dt; if (p.life <= 0) { this.parts.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.type === 'conf' || p.type === 'bone') p.vx += Math.sin(p.life * 6 + p.size) * 60 * dt;
    }
    for (let i = this.pops.length - 1; i >= 0; i--) { const p = this.pops[i]; p.t += dt; if (p.t > p.max) this.pops.splice(i, 1); }
    if (this.fl && (this.fl.t += dt) > 1.1) this.fl = null;
  },
  drawBack(g) {
    const f = this.fl; if (!f) return;
    g.save(); g.globalAlpha = Math.min(1, (1 - f.t / 1.1) * 1.8); g.translate(f.x, f.y); g.rotate(f.t * 0.45);
    for (let i = 0; i < 18; i++) {
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 1300, (i * Math.PI) / 9, ((i + 1) * Math.PI) / 9); g.closePath();
      g.fillStyle = i % 2 ? '#ffe36e' : '#ffc233'; g.fill();
    }
    g.restore();
  },
  draw(g) {
    for (const p of this.parts) {
      const k = p.life / p.max, s = p.size;
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.globalAlpha = Math.min(1, k * 2.5);
      if (p.type === 'star') {   // four-point sparkle
        g.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? s * 0.34 : s, a = (i * Math.PI) / 4; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
        g.closePath(); ink(g, p.col, 2);
      } else if (p.type === 'ring') {   // impact lines, comic style
        const r0 = p.size * (1 - k) * 0.75 + 12, r1 = r0 + 8 + 16 * k;
        g.globalAlpha = Math.min(1, k * 3); g.beginPath();
        for (let i = 0; i < 11; i++) { const a = (i / 11) * Math.PI * 2; g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); g.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); }
        ink(g, null, 3);
      } else if (p.type === 'dust') { g.globalAlpha = Math.min(1, k * 2); g.beginPath(); g.arc(0, 0, s * (1.5 - k * 0.6), 0, 7); ink(g, p.col, 2); }
      else if (p.type === 'heart') {
        g.beginPath(); g.moveTo(0, s * 0.9); g.bezierCurveTo(-s * 1.5, -s * 0.2, -s * 0.5, -s * 1.2, 0, -s * 0.35);
        g.bezierCurveTo(s * 0.5, -s * 1.2, s * 1.5, -s * 0.2, 0, s * 0.9); ink(g, p.col, 2.2);
      } else if (p.type === 'drop') {
        g.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2 - p.rot);
        g.beginPath(); g.moveTo(0, -s * 1.5); g.quadraticCurveTo(s, 0, 0, s * 0.8); g.quadraticCurveTo(-s, 0, 0, -s * 1.5); ink(g, p.col, 2);
      } else if (p.type === 'bone') {
        g.beginPath(); g.roundRect(-s, -s * 0.28, s * 2, s * 0.56, 2);
        for (const [x, y] of [[-s, -s * 0.3], [-s, s * 0.3], [s, -s * 0.3], [s, s * 0.3]]) { g.moveTo(x + s * 0.4, y); g.arc(x, y, s * 0.4, 0, 7); }
        ink(g, '#fff', 1.8);
      } else { g.beginPath(); g.rect(-s / 2, -s / 3, s, s * 0.66); ink(g, p.col, 1.6); }
      g.restore();
    }
    for (const p of this.pops) {
      const a = p.t / p.max, sc = a < 0.12 ? 0.4 + (a / 0.12) * 0.75 : a < 0.2 ? 1.15 - ((a - 0.12) / 0.08) * 0.15 : 1;
      g.save(); g.translate(p.x, p.y - a * 18); g.rotate(p.rot); g.scale(sc, sc); g.globalAlpha = a > 0.82 ? (1 - a) * 5.5 : 1;
      if (p.size >= 30) {   // spiky shout balloon
        g.font = `bold ${p.size}px ${FONT}`;
        const rx = g.measureText(p.text.toUpperCase()).width / 2 + p.size * 0.75, ry = p.size * 1.05, n = 18;
        g.beginPath();
        for (let i = 0; i < n * 2; i++) {
          const an = (i / (n * 2)) * Math.PI * 2, r = i % 2 ? 0.8 : 1.06 + jit(p.seed, i, 0.07);
          g.lineTo(Math.cos(an) * rx * r, Math.sin(an) * ry * r);
        }
        g.closePath(); ink(g, '#fff', 3.4);
      }
      comic(g, p.text, 0, 0, p.size, p.col);
      if (p.sub) comic(g, p.sub, 0, p.size * (p.size >= 30 ? 1.5 : 0.9), Math.max(13, Math.round(p.size * 0.36)), '#fff');
      g.restore();
    }
  },
};

// Your two problems, as meters: staying upright, and how long your legs will put up with it.
function drawMeters(g, d, x, y) {
  const w = 190, hgt = 13, X = (th) => x + clamp(th / 2.05, 0, 1) * w;
  const bar = (yy) => { g.beginPath(); g.roundRect(x, yy, w, hgt, 6); };
  comic(g, 'balance', x, y - 19, 12, '#fff', 'left');
  comic(g, 'all fours', x, y + 26, 10.5, '#fff', 'left'); comic(g, 'flop', x + w, y + 26, 10.5, '#fff', 'right');
  bar(y); g.fillStyle = '#f6ecd2'; g.fill();
  g.save(); bar(y); g.clip();
  g.fillStyle = '#ffd23f'; g.fillRect(X(1.08), y, X(1.78) - X(1.08), hgt);
  g.fillStyle = '#7bcf6b'; g.fillRect(X(TH0 - 0.2), y, X(TH0 + 0.2) - X(TH0 - 0.2), hgt);
  g.fillStyle = '#ee5a45'; g.fillRect(X(1.78), y, x + w - X(1.78), hgt);
  g.restore(); bar(y); ink(g, null, 3);
  const nx = X(d.state === 'ok' ? d.th : 2.05);
  g.beginPath(); g.moveTo(nx, y + 10); g.lineTo(nx - 8, y - 8); g.lineTo(nx + 8, y - 8); g.closePath(); ink(g, '#fff', 2.6);
  const y2 = y + 60, low = d.stam < 0.3 || d.tired > 0;
  comic(g, d.tired > 0 ? 'legs (gave out!)' : 'legs', x, y2 - 12, 12, '#fff', 'left');
  bar(y2); g.fillStyle = '#f6ecd2'; g.fill();
  g.save(); bar(y2); g.clip(); g.fillStyle = low ? '#ee5a45' : '#7cc7ee'; g.fillRect(x, y2, w * d.stam, hgt); g.restore();
  bar(y2); ink(g, null, 3);
}
